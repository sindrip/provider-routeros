name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go.mod pins a prerelease (go 1.27rc2), which setup-go cannot parse
      # from go-version-file (its regex truncates it to 1.27). Bootstrap a
      # stable toolchain and let GOTOOLCHAIN=auto fetch the pinned one.
      # Switch to go-version-file once 1.27 is final.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # No root go.sum (the substrate stays clean), so name the real
          # key inputs; go.mod so a toolchain bump rotates the cache.
          cache-dependency-path: |
            go.mod
            go.work.sum
            tools/go.sum

      # setup-go exports GOTOOLCHAIN=local, which forbids fetching the
      # pinned prerelease. GITHUB_ENV overrides it; job-level env would not.
      - name: Allow toolchain downloads
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - run: go build ./...
      - run: go test ./...
      - run: go tool golangci-lint run

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.mod
            go.work.sum
            tools/go.sum
      - name: Allow toolchain downloads
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - run: go run ./cmd/probe
      - run: >-
          jq -r '"\(.probe): \(.menus | length) menus on \(.routeros)"'
          observations/*.json
