# ocb build manifest. The point of the exercise: the receiver is a component
# in a standard collector, not a bespoke service. Swapping the exporter set
# is config, not code — which is why this shape beats a per-device binary.
dist:
  name: otelcol-routeros
  description: Spike distro carrying the RouterOS receiver.
  # Generated tree; gitignored. Builds need -buildvcs=false when the checkout
  # is a git worktree, which Go's VCS stamping exits 128 on.
  output_path: ./_dist
  otelcol_version: 0.158.0

receivers:
  # `name` overrides the Go import alias, which ocb otherwise derives from the
  # last path segment — "collector" would be both wrong and confusing.
  - gomod: github.com/sindrip/provider-routeros/collector v0.0.0
    name: routerosreceiver

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.158.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusexporter v0.158.0

# _dist is a generated main module with its own go.mod, and Go ignores replace
# directives in anything that is not the main module. So the receiver's own
# replaces for rest and routeros do not carry over — without repeating them
# here, _dist tries to resolve them from the network and fails on v0.0.0.
# Paths are relative to _dist/, which sits one level below this file.
replaces:
  - github.com/sindrip/provider-routeros/collector => ../
  - github.com/sindrip/provider-routeros/rest => ../../rest
  - github.com/sindrip/provider-routeros/routeros => ../../routeros
