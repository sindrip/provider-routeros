default:
all_set:
  metrics:
    routeros.bgp.session.prefix.count:
      enabled: true
      attributes: ["network.peer.name","network.peer.as"]
    routeros.bgp.session.up:
      enabled: true
      attributes: ["network.peer.name","network.peer.as"]
    routeros.firewall.rule.io:
      enabled: true
      attributes: ["firewall.rule"]
    routeros.hw.temperature:
      enabled: true
      attributes: ["hw.id"]
    routeros.interface.io:
      enabled: true
      attributes: ["network.interface.name","network.io.direction"]
    routeros.interface.up:
      enabled: true
      attributes: ["network.interface.name"]
  resource_attributes:
    routeros.device.model:
      enabled: true
    routeros.device.serial:
      enabled: true
    routeros.os.version:
      enabled: true
    service.instance.id:
      enabled: true
    service.name:
      enabled: true
reaggregate_set:
  metrics:
    routeros.bgp.session.prefix.count:
      enabled: true
      attributes: []
    routeros.bgp.session.up:
      enabled: true
      attributes: []
    routeros.firewall.rule.io:
      enabled: true
      attributes: []
    routeros.hw.temperature:
      enabled: true
      attributes: []
    routeros.interface.io:
      enabled: true
      attributes: []
    routeros.interface.up:
      enabled: true
      attributes: []
  resource_attributes:
    routeros.device.model:
      enabled: true
    routeros.device.serial:
      enabled: true
    routeros.os.version:
      enabled: true
    service.instance.id:
      enabled: true
    service.name:
      enabled: true
none_set:
  metrics:
    routeros.bgp.session.prefix.count:
      enabled: false
      attributes: ["network.peer.name","network.peer.as"]
    routeros.bgp.session.up:
      enabled: false
      attributes: ["network.peer.name","network.peer.as"]
    routeros.firewall.rule.io:
      enabled: false
      attributes: ["firewall.rule"]
    routeros.hw.temperature:
      enabled: false
      attributes: ["hw.id"]
    routeros.interface.io:
      enabled: false
      attributes: ["network.interface.name","network.io.direction"]
    routeros.interface.up:
      enabled: false
      attributes: ["network.interface.name"]
  resource_attributes:
    routeros.device.model:
      enabled: false
    routeros.device.serial:
      enabled: false
    routeros.os.version:
      enabled: false
    service.instance.id:
      enabled: false
    service.name:
      enabled: false
filter_set_include:
  resource_attributes:
    routeros.device.model:
      enabled: true
      metrics_include:
        - regexp: ".*"
    routeros.device.serial:
      enabled: true
      metrics_include:
        - regexp: ".*"
    routeros.os.version:
      enabled: true
      metrics_include:
        - regexp: ".*"
    service.instance.id:
      enabled: true
      metrics_include:
        - regexp: ".*"
    service.name:
      enabled: true
      metrics_include:
        - regexp: ".*"
filter_set_exclude:
  resource_attributes:
    routeros.device.model:
      enabled: true
      metrics_exclude:
        - strict: "routeros.device.model-val"
    routeros.device.serial:
      enabled: true
      metrics_exclude:
        - strict: "routeros.device.serial-val"
    routeros.os.version:
      enabled: true
      metrics_exclude:
        - strict: "routeros.os.version-val"
    service.instance.id:
      enabled: true
      metrics_exclude:
        - strict: "service.instance.id-val"
    service.name:
      enabled: true
      metrics_exclude:
        - strict: "service.name-val"
