    routeros_ip_hotspot:
        subCategory: ""
        name: routeros_ip_hotspot
        title: routeros_ip_hotspot (Resource)
        argumentDocs:
            address_pool: (String) Address space used to change HotSpot client any IP address to a valid address. Useful for providing public network access to mobile clients that are not willing to change their networking settings.
            addresses_per_mac: (String) Number of IP addresses allowed to be bind with the MAC address, when multiple HotSpot clients connected with one MAC-address.
            disabled: (Boolean)
            id: (String) The ID of this resource.
            idle_timeout: (String) Period of inactivity for unauthorized clients. When there is no traffic from this client (literally client computer should be switched off), once the timeout is reached, a user is dropped from the HotSpot host list, its used address becomes available.
            interface: (String) Interface to run HotSpot on.
            invalid: (Boolean)
            keepalive_timeout: (String) The exact value of the keepalive-timeout, that is applied to the user. Value shows how long the host can stay out of reach to be removed from the HotSpot.
            login_timeout: (String) Period of time after which if a host hasn't been authorized itself with a system the host entry gets deleted from host table. Loop repeats until the host logs in the system. Enable if there are situations where a host cannot log in after being too long in the host table unauthorized.
            name: (String) HotSpot server's name or identifier.
            profile: (String) HotSpot server default HotSpot profile, which is located in `/ip/hotspot/profile`.
        importStatements:
            - terraform import routeros_ip_hotspot.test *3
            - terraform import routeros_ip_hotspot.test "name=xxx"
    routeros_ip_hotspot_ip_binding:
        subCategory: ""
        name: routeros_ip_hotspot_ip_binding
        title: routeros_ip_hotspot_ip_binding (Resource)
        argumentDocs:
            address: (String) The original IP address of the client.
            comment: (String)
            disabled: (Boolean)
            id: (String) The ID of this resource.
            mac_address: (String) MAC address of the client.
            server: (String) Name of the HotSpot server. `all` - will be applied to all hotspot servers.
            to_address: (String) New IP address of the client, translation occurs on the router (client does not know anything about the translation).
            type: (String) Type of the IP-binding action
        importStatements:
            - terraform import routeros_ip_hotspot_ip_binding.test *3
            - terraform import routeros_ip_hotspot_ip_binding.test "name=xxx"
    routeros_ip_hotspot_profile:
        subCategory: ""
        name: routeros_ip_hotspot_profile
        title: routeros_ip_hotspot_profile (Resource)
        argumentDocs:
            dns_name: (String) DNS name of the HotSpot server (it appears as the location of the login page). This name will automatically be added as a static DNS entry in the DNS cache. Name can affect if Hotspot is automatically detected by client device. For example, iOS devices may not detect Hotspot that has a name which includes `.local`.
            hotspot_address: (String) IP address of HotSpot service.
            html_directory: '(String) Directory name in which HotSpot HTML pages are stored (by default hotspot directory). It is possible to specify different directory with modified HTML pages. To change HotSpot login page, connect to the router with FTP and download hotspot directory contents. v6.31 and older software builds: For devices where `flash` directory is present, hotspot html directory must be stored there and path must be typed in as follows: `/(hotspot_dir)`. This must be done in this order as hotspot sees `flash` directory as root location. v6.32 and newer software builds: full path must be typed in html-directory field, including `/flash/(hotspot_dir)`.'
            html_directory_override: (String) Alternative path for hotspot html files. It should be used only if customized hotspot html files are stored on external storage(attached usb, hdd, etc). If configured then hotspot will switch to this html path as soon at it becomes available and switch back to html-directory path if override path becomes non-available for some reason.
            http_cookie_lifetime: (String) HTTP cookie validity time, the option is related to cookie HotSpot login method.
            http_proxy: (String) Address and port of the proxy server for HotSpot service, when default value is used all request are resolved by the local `/ip proxy`.
            https_redirect: (Boolean) Whether to redirect unauthenticated user to hotspot login page, if he is visiting a https:// url. Since certificate domain name will mismatch, often this leads to errors, so you can set this parameter to `no` and all https requests will simply be rejected and user will have to visit a http page.
            id: (String) The ID of this resource.
            login_by: (Set of String) Used HotSpot authentication method
            mac_auth_mode: (String) Allows to control User-Name and User-Password RADIUS attributes when using MAC authentication.
            mac_auth_password: (String, Sensitive) Used together with MAC authentication, field used to specify password for the users to be authenticated by their MAC addresses. The following option is required, when specific RADIUS server rejects authentication for the clients with blank password.
            name: (String) Descriptive name of the profile.
            nas_port_type: (String) `NAS-Port-Type` value to be sent to RADIUS server, `NAS-Port-Type` values are described in the RADIUS RFC 2865. This optional value attribute indicates the type of the physical port of the HotSpot server.
            radius_accounting: (Boolean) Send RADIUS server accounting information for each user, when yes is used.
            radius_default_domain: (String) Default domain to use for RADIUS requests. Allows to use separate RADIUS server per `/ip hotspot profile`. If used, same domain name should be specified under `/radius domain` value.
            radius_interim_update: (String) How often to send accounting updates . When received is set, interim-time is used from RADIUS server. 0s is the same as received.
            radius_location_id: (String) `RADIUS-Location-Id` property.
            radius_location_name: (String) `RADIUS-Location-Id` to be sent to RADIUS server. Used to identify location of the HotSpot server during the communication with RADIUS server. Value is optional and used together with RADIUS server.
            radius_mac_format: (String) Controls how the MAC address of the client is encoded in the `User-Name` and `User-Password` attributes when using MAC authentication.
            rate_limit: (String) Rate limitation in form of rx-rate[/tx-rate] [rx-burst-rate[/tx-burst-rate] [rx-burst-threshold[/tx-burst-threshold] [rx-burst-time[/tx-burst-time]]]] [priority] [rx-rate-min[/tx-rate-min]] from the point of view of the router (so `rx` is client upload, and `tx` is client download). All rates should be numbers with optional 'k' (1,000s) or 'M' (1,000,000s). If tx-rate is not specified, rx-rate is as tx-rate too. Same goes for tx-burst-rate and tx-burst-threshold and tx-burst-time. If both rx-burst-threshold and tx-burst-threshold are not specified (but burst-rate is specified), rx-rate and tx-rate is used as burst thresholds. If both rx-burst-time and tx-burst-time are not specified, 1s is used as default. rx-rate-min and tx-rate min are the values of limit-at properties.
            smtp_server: (String) SMTP server address to be used to redirect HotSpot users SMTP requests.
            split_user_domain: (Boolean) Split username from domain name when the username is given in `user@domain` or in `domain\user` format from RADIUS server.
            ssl_certificate: (String) Name of the SSL certificate on the router to to use only for HTTPS authentication.
            trial_uptime_limit: (String) Used only with trial authentication method. Time value specifies, how long trial user identified by MAC address can use access to public networks without HotSpot authentication.
            trial_uptime_reset: (String) Used only with trial authentication method.
            trial_user_profile: (String) Specifies hotspot user profile for trial users.
            use_radius: (Boolean) Use RADIUS to authenticate HotSpot users.
        importStatements:
            - terraform import routeros_ip_hotspot_profile.test *3
            - terraform import routeros_ip_hotspot_profile.test "name=xxx"
    routeros_ip_hotspot_service_port:
        subCategory: ""
        name: routeros_ip_hotspot_service_port
        title: routeros_ip_hotspot_service_port (Resource)
        argumentDocs:
            disabled: (Boolean)
            id: (String) The ID of this resource.
            name: (String) Service name.
            ports: (String)
        importStatements:
            - terraform import routeros_ip_hotspot_service_port.test *1
            - terraform import routeros_ip_hotspot_service_port.test "name=xxx"
    routeros_ip_hotspot_user:
        subCategory: ""
        name: routeros_ip_hotspot_user
        title: routeros_ip_hotspot_user (Resource)
        argumentDocs:
            address: (Number) IP address, when specified client will get the address from the HotSpot one-to-one NAT translations. Address does not restrict HotSpot login only from this address.
            comment: (String)
            default: (Boolean) It's the default item.
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            email: (String) HotSpot client's e-mail, informational value for the HotSpot user.
            id: (String) The ID of this resource.
            limit_bytes_in: (Number) Maximal amount of bytes that can be received from the user. User is disconnected from HotSpot after the limit is reached.
            limit_bytes_out: (Number) Maximal amount of bytes that can be transmitted from the user. User is disconnected from HotSpot after the limit is reached.
            limit_bytes_total: (Number) (limit-bytes-in+limit-bytes-out). User is disconnected from HotSpot after the limit is reached.
            limit_uptime: (Number) Uptime limit for the HotSpot client, user is disconnected from HotSpot as soon as uptime is reached.
            mac_address: (Number) Client is allowed to login only from the specified MAC-address. If value is 00:00:00:00:00:00, any mac address is allowed.
            name: (String) HotSpot login page username, when MAC-address authentication is used name is configured as client's MAC-address.
            password: (String, Sensitive) User password.
            profile: (String) User profile configured in `/ip hotspot user profile`.
            routes: (String) Routes added to HotSpot gateway when client is connected. The route format dst-address gateway metric (for example, `192.168.1.0/24 192.168.0.1 1`).
            server: (String) HotSpot server's name to which user is allowed login.
        importStatements:
            - terraform import routeros_ip_hotspot_user.test *3
            - terraform import routeros_ip_hotspot_user.test "name=xxx"
    routeros_ip_hotspot_user_profile:
        subCategory: ""
        name: routeros_ip_hotspot_user_profile
        title: routeros_ip_hotspot_user_profile (Resource)
        argumentDocs:
            add_mac_cookie: (Boolean) Allows to add mac cookie for users.
            address_list: (String) Name of the address list in which users IP address will be added. Useful to mark traffic per user groups for queue tree configurations.
            address_pool: (String) IP pool name from which the user will get IP. When user has improper network settings configuration on the computer, HotSpot server makes translation and assigns correct IP address from the pool instead of incorrect one.
            advertise: (Boolean) Enable forced advertisement popups. After certain interval specific web-page is being displayed for HotSpot users. Advertisement page might be blocked by browsers popup blockers.
            advertise_interval: (Set of String) Set of intervals between advertisement popups. After the list is done, the last value is used for all further advertisements, 10 minutes.
            advertise_timeout: (String) How long advertisement is shown, before blocking network access for HotSpot client. Connection to Internet is not allowed, when advertisement is not shown.
            advertise_url: (String) List of URLs that is show for advertisement popups. After the last URL is used, list starts from the begining.
            default: (Boolean) It's the default item.
            id: (String) The ID of this resource.
            idle_timeout: (String) Maximal period of inactivity for authorized HotSpot clients. Timer is counting, when there is no traffic coming from that client and going through the router, for example computer is switched off. User is logged out, dropped of the host list, the address used by the user is freed, when timeout is reached.
            incoming_filter: (String) Name of the firewall chain applied to incoming packets from the users of this profile, jump rule is required from built-in chain (input, forward, output) to chain=hotspot.
            incoming_packet_mark: (String) Packet mark put on incoming packets from every user of this profile.
            insert_queue_before: (String)
            keepalive_timeout: (String) Keepalive timeout for authorized HotSpot clients. Used to detect, that the computer of the client is alive and reachable. User is logged out, when timeout value is reached.
            mac_cookie_timeout: (String) Selects mac-cookie timeout from last login or logout. Read more>>.
            name: (String) Descriptive name of the profile.
            on_login: '(String) Script name to be executed, when user logs in to the HotSpot from the particular profile. It is possible to get username from internal user and interface variable. For example, :log info ``User $user logged in!`` . If hotspot is set on bridge interface, then interface variable will show bridge as actual interface unless use-ip-firewall'' is set in bridge settings. List of available variables: $user $username (alternative var name for $user) $address $``mac-address`` $interface.'
            on_logout: '(String) Script name to be executed, when user logs out from the HotSpot.It is possible to get username from internal user and interface variable. For example, :log info ``User $user logged in!`` . If hotspot is set on bridge interface, then interface variable will show bridge as actual interface unless use-ip-firewall is set in bridge settings. List of available variables: $user $username (alternative var name for $user) $address $``mac-address`` $interface $cause Starting with v6.34rc11 some additional variables are available: $uptime-secs - final session time in seconds $bytes-in - bytes uploaded $bytes-out - bytes downloaded $bytes-total - bytes up + bytes down $packets-in - packets uploaded $packets-out - packets downloaded $packets-total - packets up + packets down.'
            open_status_page: (String) Option to show status page for user authenticated with mac login method. For example to show advertisement on status page (alogin.html) http-login - open status page only for HTTP login (includes cookie and HTTPS) always - open HTTP status page in case of mac login as well.
            outgoing_filter: (String) Name of the firewall chain applied to outgoing packets from the users of this profile, jump rule is required from built-in chain (input, forward, output) to chain=hotspot.
            outgoing_packet_mark: (String) Packet mark put on outgoing packets from every user of this profile.
            parent_queue: (String)
            queue_type: (String)
            rate_limit: (String) Simple dynamic queue is created for user, once it logs in to the HotSpot. Rate-limitation is configured in the following form [rx-rate[/tx-rate] [rx-burst-rate[/tx-burst-rate] [rx-burst-threshold[/tx-burst-threshold] [rx-burst-time[/tx-burst-time] [priority] [rx-rate-min[/tx-rate-min]]]]. For example, to set 1M download, 512k upload for the client, rate-limit=512k/1M.
            session_timeout: (String) Allowed session time for client. After this time, the user is logged out unconditionally.
            shared_users: (String) Allowed number of simultaneously logged in users with the same HotSpot username.
            status_autorefresh: (String) HotSpot status page autorefresh interval.
            transparent_proxy: (Boolean) Use transparent HTTP proxy for the authorized users of this profile.
        importStatements:
            - terraform import routeros_ip_hotspot_user_profile.test *3
            - terraform import routeros_ip_hotspot_user_profile.test "name=xxx"
    routeros_ip_hotspot_walled_garden:
        subCategory: ""
        name: routeros_ip_hotspot_walled_garden
        title: routeros_ip_hotspot_walled_garden (Resource)
        argumentDocs:
            action: (String) Action to perform, when packet matches the rule `allow` - allow access to the web-page without authorization, `deny` - the authorization is required to access the web-page.
            comment: (String)
            disabled: (Boolean)
            dst_host: (String) Domain name of the destination web-server.
            dst_port: (String) TCP port number, client sends request to.
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            id: (String) The ID of this resource.
            method: (String) HTTP method of the request.
            path: (String) The path of the request, path comes after `http://dst_host/`.
            server: (String) Name of the HotSpot server, rule is applied to.
            src_address: (String) Source address of the user, usually IP address of the HotSpot client.
        importStatements:
            - terraform import routeros_ip_hotspot_walled_garden.test *3
            - terraform import routeros_ip_hotspot_walled_garden.test "name=xxx"
    routeros_ip_hotspot_walled_garden_ip:
        subCategory: ""
        name: routeros_ip_hotspot_walled_garden_ip
        title: routeros_ip_hotspot_walled_garden_ip (Resource)
        argumentDocs:
            action: (String) Action to perform, when packet matches the rule allow - allow access to the web-page without authorization deny - the authorization is required to access the web-page reject - the authorization is required to access the resource, ICMP reject message will be sent to client, when packet will match the rule.
            comment: (String)
            disabled: (Boolean)
            dst_address: (String) Destination IP address, IP address of the WEB-server. Ignored if dst-host is already specified.
            dst_address_list: (String) Destination IP address list. Ignored if dst-host is already specified.
            dst_host: (String) Domain name of the destination web-server. When this parameter is specified dynamic entry is added to Walled Garden.
            dst_port: (String) TCP port number, client sends request to.
            id: (String) The ID of this resource.
            invalid: (Boolean)
            protocol: (String) IP protocol.
            server: (String) Name of the HotSpot server, rule is applied to.
            src_address: (String) Source address of the user, usually IP address of the HotSpot client.
            src_address_list: (String) Source IP address list.
        importStatements:
            - terraform import routeros_ip_hotspot_walled_garden_ip.test *3
            - terraform import routeros_ip_hotspot_walled_garden_ip.test "name=xxx"
    routeros_ip_ipsec_identity:
        subCategory: ""
        name: routeros_ip_ipsec_identity
        title: routeros_ip_ipsec_identity (Resource)
        argumentDocs:
            auth_method: '(String) Authentication method:'
            certificate: (String) Name of a certificate listed in System/Certificates (signing packets; the certificate must have the private key). Applicable if digital signature authentication method (`auth-method=digital-signature`) or EAP (a`uth-method=eap`) is used.
            comment: (String)
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            eap_methods: '(String) All EAP methods requires whole certificate chain including intermediate and root CA certificates to be present in System/Certificates menu. Also, the username and password (if required by the authentication server) must be specified. Multiple EAP methods may be specified and will be used in a specified order. Currently supported EAP methods:'
            generate_policy: (String) Allow this peer to establish SA for non-existing policies. Such policies are created dynamically for the lifetime of SA. Automatic policies allows, for example, to create IPsec secured L2TP tunnels, or any other setup where remote peer's IP address is not known at the configuration time. `no` - do not generate policies; `port-override` - generate policies and force policy to use any port (old behavior); `port-strict` - use ports from peer's proposal, which should match peer's policy.
            id: (String) The ID of this resource.
            key: (String) Name of the private key from keys menu. Applicable if RSA key authentication method (`auth-method=rsa-key`) is used.
            match_by: (String) Defines the logic used for peer's identity validation. `remote-id` - will verify the peer's ID according to remote-id setting. `certificate` will verify the peer's certificate with what is specified under remote-certificate setting.
            mode_config: (String) Name of the configuration parameters from mode-config menu. When parameter is set mode-config is enabled.
            my_id: '(String) On initiator, this controls what ID_i is sent to the responder. On responder, this controls what ID_r is sent to the initiator. In IKEv2, responder also expects this ID in received ID_r from initiator. `auto` - tries to use correct ID automatically: IP for pre-shared key, SAN (DN if not present) for certificate based connections; `address` - IP address is used as ID;dn - the binary Distinguished Encoding Rules (DER) encoding of an ASN.1 X.500 Distinguished Name; `fqdn` - fully qualified domain name; `key-id` - use the specified key ID for the identity; `user-fqdn` - specifies a fully-qualified username string, for example, `user@domain.com`.'
            notrack_chain: (String) Adds IP/Firewall/Raw rules matching IPsec policy to a specified chain. Use together with generate-policy.
            password: (String, Sensitive) XAuth or EAP password. Applicable if pre-shared key with XAuth authentication method (`auth-method=pre-shared-key-xauth`) or EAP (`auth-method=eap`) is used.
            peer: (String) Name of the peer on which the identity applies.
            policy_template_group: (String) If generate-policy is enabled, traffic selectors are checked against templates from the same group. If none of the templates match, Phase 2 SA will not be established.
            remote_certificate: (String) Name of a certificate (listed in `System/Certificates`) for authenticating the remote side (validating packets; no private key required). If a remote-certificate is not specified then the received certificate from a remote peer is used and checked against CA in the certificate menu. Proper CA must be imported in a certificate store. If remote-certificate and match-by=certificate is specified, only the specific client certificate will be matched. Applicable if digital signature authentication method (`auth-method=digital-signature`) is used.
            remote_id: (String) This parameter controls what ID value to expect from the remote peer. Note that all types except for ignoring will verify remote peer's ID with a received certificate. In case when the peer sends the certificate name as its ID, it is checked against the certificate, else the ID is checked against Subject Alt. Name. `auto` - accept all ID's;address - IP address is used as ID;dn - the binary Distinguished Encoding Rules (DER) encoding of an ASN.1 X.500 Distinguished Name; `fqdn` - fully qualified domain name. Only supported in IKEv2; `user-fqdn` - a fully-qualified username string, for example, `user@domain.com`. Only supported in IKEv2; `key-id` - specific key ID for the identity. Only supported in IKEv2; `ignore` - do not verify received ID with certificate (dangerous). * Wildcard key ID matching **is not supported**, for example `remote-id=`key-id:CN=*.domain.com`.
            remote_key: (String) Name of the public key from keys menu. Applicable if RSA key authentication method (`auth-method=rsa-key`) is used.
            secret: (String, Sensitive) Secret string. If it starts with '0x', it is parsed as a hexadecimal value. Applicable if pre-shared key authentication method (`auth-method=pre-shared-key` and `auth-method=pre-shared-key-xauth`) is used.
            username: (String) XAuth or EAP username. Applicable if pre-shared key with XAuth authentication method (`auth-method=pre-shared-key-xauth`) or EAP (`auth-method=eap`) is used.
        importStatements:
            - terraform import routeros_ip_ipsec_identity.test *3
            - terraform import routeros_ip_ipsec_identity.test "peer=NordVPN"
    routeros_ip_ipsec_key:
        subCategory: ""
        name: routeros_ip_ipsec_key
        title: routeros_ip_ipsec_key (Resource)
        argumentDocs:
            id: (String) The ID of this resource.
            key_size: (Number) Size of this key.
            name: (String)
        importStatements:
            - terraform import routeros_ip_ipsec_key.test *3
            - terraform import routeros_ip_ipsec_key.test "name=test-key"
    routeros_ip_ipsec_mode_config:
        subCategory: ""
        name: routeros_ip_ipsec_mode_config
        title: routeros_ip_ipsec_mode_config (Resource)
        argumentDocs:
            address: (String) Single IP address for the initiator instead of specifying a whole address pool.
            address_pool: (String) Name of the address pool from which the responder will try to assign address if mode-config is enabled.
            address_prefix_length: (Number) Prefix length (netmask) of the assigned address from the pool.
            connection_mark: (String) Firewall connection mark.
            id: (String) The ID of this resource.
            name: (String)
            responder: (Boolean) Specifies whether the configuration will work as an initiator (client) or responder (server). The initiator will request for mode-config parameters from the responder.
            split_dns: (Set of String) List of DNS names that will be resolved using a system-dns=yes or static-dns= setting.
            split_include: (Set of String) List of subnets in CIDR format, which to tunnel. Subnets will be sent to the peer using the CISCO UNITY extension, a remote peer will create specific dynamic policies.
            src_address_list: (String) Specifying an address list will generate dynamic source NAT rules. This parameter is only available with responder=no. A roadWarrior client with NAT.
            static_dns: (String) Manually specified DNS server's IP address to be sent to the client.
            system_dns: (Boolean) When this option is enabled DNS addresses will be taken from `/ip dns`.
            use_responder_dns: (String)
        importStatements:
            - terraform import routeros_ip_ipsec_mode_config.test *3
            - terraform import routeros_ip_ipsec_mode_config.test "address=1.2.3.4"
    routeros_ip_ipsec_peer:
        subCategory: ""
        name: routeros_ip_ipsec_peer
        title: routeros_ip_ipsec_peer (Resource)
        argumentDocs:
            address: (String) If the remote peer's address matches this prefix, then the peer configuration is used in authentication and establishment of Phase 1. If several peer's addresses match several configuration entries, the most specific one (i.e. the one with the largest netmask) will be used.
            comment: (String)
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            exchange_mode: (String) Different ISAKMP phase 1 exchange modes according to RFC 2408. the main mode relaxes rfc2409 section 5.4, to allow pre-shared-key authentication in the main mode. ike2 mode enables Ikev2 RFC 7296. Parameters that are ignored by IKEv2 proposal-check, compatibility-options, lifebytes, dpd-maximum-failures, nat-traversal.
            id: (String) The ID of this resource.
            local_address: (String) Routers local address on which Phase 1 should be bounded to.
            name: (String) Peer name.
            passive: (Boolean) When a passive mode is enabled will wait for a remote peer to initiate an IKE connection. The enabled passive mode also indicates that the peer is xauth responder, and disabled passive mode - xauth initiator. When a passive mode is a disabled peer will try to establish not only phase1 but also phase2 automatically, if policies are configured or created during the phase1.
            port: (Number) Communication port used (when a router is an initiator) to connect to remote peer in cases if remote peer uses the non-default port.
            profile: (String) Name of the profile template that will be used during IKE negotiation.
            responder: (Boolean) Whether this peer will act as a responder only (listen to incoming requests) and not initiate a connection.
            send_initial_contact: (Boolean) Specifies whether to send `initial contact` IKE packet or wait for remote side, this packet should trigger the removal of old peer SAs for current source address. Usually, in road warrior setups clients are initiators and this parameter should be set to no. Initial contact is not sent if modecfg or xauth is enabled for ikev1.
        importStatements:
            - terraform import routeros_ip_ipsec_peer.test *3
            - terraform import routeros_ip_ipsec_peer.test "name=NordVPN"
    routeros_ip_ipsec_policy:
        subCategory: ""
        name: routeros_ip_ipsec_policy
        title: routeros_ip_ipsec_policy (Resource)
        argumentDocs:
            action: (String) Specifies what to do with the packet matched by the policy.none - pass the packet unchanged.discard - drop the packet.encrypt - apply transformations specified in this policy and it's SA.
            active: (Boolean)
            comment: (String)
            disabled: (Boolean)
            dst_address: (String) Destination address to be matched in packets. Applicable when tunnel mode (`tunnel=yes`) or template (`template=yes`) is used.
            dst_port: (String) Destination port to be matched in packets. If set to any all ports will be matched.
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            group: (String) Name of the policy group to which this **template** is assigned.
            id: (String) The ID of this resource.
            invalid: (Boolean)
            ipsec_protocols: (String) Specifies what combination of Authentication Header and Encapsulating Security Payload protocols you want to apply to matched traffic.
            level: '(String) Specifies what to do if some of the SAs for this policy cannot be found:'
            peer: (String) Name of the peer on which the policy applies.
            proposal: (String) Name of the proposal template that will be sent by IKE daemon to establish SAs for this policy.
            protocol: (String) IP packet protocol to match.
            src_address: (String) Source address to be matched in packets. Applicable when tunnel mode (`tunnel=yes`) or template (`template=yes`) is used.
            src_port: (String) Source port to be matched in packets. If set to any all ports will be matched.
            template: '(Boolean) Creates a template and assigns it to a specified policy group.Following parameters are used by template:'
            tunnel: (Boolean) Specifies whether to use tunnel mode.
        importStatements:
            - terraform import routeros_ip_ipsec_policy.test *3
            - terraform import routeros_ip_ipsec_policy.test "group=test-group"
    routeros_ip_ipsec_policy_group:
        subCategory: ""
        name: routeros_ip_ipsec_policy_group
        title: routeros_ip_ipsec_policy_group (Resource)
        argumentDocs:
            comment: (String)
            default: (Boolean) It's the default item.
            id: (String) The ID of this resource.
            name: (String)
        importStatements:
            - terraform import routeros_ip_ipsec_policy_group.test *3
            - terraform import routeros_ip_ipsec_policy_group.test "name=test-group"
    routeros_ip_ipsec_profile:
        subCategory: ""
        name: routeros_ip_ipsec_profile
        title: routeros_ip_ipsec_profile (Resource)
        argumentDocs:
            dh_group: (Set of String) Diffie-Hellman group (cipher strength).
            dpd_interval: (String) Dead peer detection interval. If set to disable-dpd, dead peer detection will not be used.
            dpd_maximum_failures: (Number) Maximum count of failures until peer is considered to be dead. Applicable if DPD is enabled.
            enc_algorithm: (Set of String) List of encryption algorithms that will be used by the peer.
            hash_algorithm: (String) Hashing algorithm. SHA (Secure Hash Algorithm) is stronger, but slower. MD5 uses 128-bit key, sha1-160bit key.
            id: (String) The ID of this resource.
            lifebytes: (Number) Phase 1 lifebytes is used only as administrative value which is added to proposal. Used in cases if remote peer requires specific lifebytes value to establish phase 1.
            lifetime: '(String) Phase 1 lifetime: specifies how long the SA will be valid.'
            name: (String)
            nat_traversal: (Boolean) Use Linux NAT-T mechanism to solve IPsec incompatibility with NAT routers between IPsec peers. This can only be used with ESP protocol (AH is not supported by design, as it signs the complete packet, including the IP header, which is changed by NAT, rendering AH signature invalid). The method encapsulates IPsec ESP traffic into UDP streams in order to overcome some minor issues that made ESP incompatible with NAT.
            prf_algorithm: (String)
            proposal_check: '(String) Phase 2 lifetime check logic:'
        importStatements:
            - terraform import routeros_ip_ipsec_profile.test *3
            - terraform import routeros_ip_ipsec_profile.test "name=test-profile"
    routeros_ip_ipsec_proposal:
        subCategory: ""
        name: routeros_ip_ipsec_proposal
        title: routeros_ip_ipsec_proposal (Resource)
        argumentDocs:
            auth_algorithms: (Set of String) Allowed algorithms for authorization. SHA (Secure Hash Algorithm) is stronger but slower. MD5 uses a 128-bit key, sha1-160bit key.
            comment: (String)
            default: (Boolean) It's the default item.
            disabled: (Boolean)
            enc_algorithms: (Set of String) Allowed algorithms and key lengths to use for SAs.
            id: (String) The ID of this resource.
            lifetime: (String) How long to use SA before throwing it out.
            name: (String)
            pfs_group: (String) The diffie-Helman group used for Perfect Forward Secrecy.
        importStatements:
            - terraform import routeros_ip_ipsec_proposal.test *3
            - terraform import routeros_ip_ipsec_proposal.test "name=NordVPN"
    routeros_ip_ipsec_settings:
        subCategory: ""
        name: routeros_ip_ipsec_settings
        title: routeros_ip_ipsec_settings (Resource)
        argumentDocs:
            accounting: (Boolean) Whether to send RADIUS accounting requests to a RADIUS server. Applicable if EAP Radius (`auth-method=eap-radius`) or pre-shared key with XAuth authentication method (`auth-method=pre-shared-key-xauth`) is used.
            id: (String) The ID of this resource.
            interim_update: (String) The interval between each consecutive RADIUS accounting Interim update. Accounting must be enabled.
            xauth_use_radius: (Boolean) Whether to use Radius client for XAuth users or not. Property is only applicable to peers using the IKEv1 exchange mode.
        importStatements:
            - terraform import routeros_ip_ipsec_settings.test .
    routeros_ip_nat_pmp:
        subCategory: ""
        name: routeros_ip_nat_pmp
        title: routeros_ip_nat_pmp (Resource)
        argumentDocs:
            enabled: (Boolean) Enable NAT-PMP service.
            id: (String) The ID of this resource.
        importStatements:
            - terraform import routeros_ip_nat_pmp.test .
    routeros_ip_nat_pmp_interfaces:
        subCategory: ""
        name: routeros_ip_nat_pmp_interfaces
        title: routeros_ip_nat_pmp_interfaces (Resource)
        argumentDocs:
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            forced_ip: (String) Allow specifying what public IP to use if the external interface has more than one IP available.
            id: (String) The ID of this resource.
            interface: (String) Interface name on which PMP will be running on
            type: '(String) NAT-PMP interface type:'
        importStatements:
            - terraform import routeros_ip_nat_pmp_interfaces.test '*1'
            - terraform import routeros_ip_nat_pmp_interfaces.test "name=xxx"
    routeros_ip_neighbor_discovery_settings:
        subCategory: ""
        name: routeros_ip_neighbor_discovery_settings
        title: routeros_ip_neighbor_discovery_settings (Resource)
        argumentDocs:
            discover_interface_list: (String) Interface list on which members the discovery protocol will run on.
            discover_interval: (String) An option to adjust the frequency at which neighbor discovery packets are transmitted. The setting is available since RouterOS version 7.16.
            id: (String) The ID of this resource.
            lldp_dcbx: (Boolean) Whether to send Data Center Bridging Capabilities Exchange Protocol (DCBX) TLVs, which allows to communicate switch QoS settings and capabilities with other neighboring devices using LLDP. **Only applies to CRS3xx, CRS5xx, CCR2116 and CCR2216 devices.**
            lldp_mac_phy_config: (Boolean) Whether to send MAC/PHY Configuration/Status TLV in LLDP, which indicates the interface capabilities, current setting of the duplex status, bit rate, and auto-negotiation. Only applies to the Ethernet interfaces. While TLV is optional in LLDP, it is mandatory when sending LLDP-MED, meaning this TLV will be included when necessary even though the property is configured as disabled.
            lldp_max_frame_size: (Boolean) Whether to send Maximum Frame Size TLV in LLDP, which indicates the maximum frame size capability of the interface in bytes (`l2mtu + 18`). Only applies to the Ethernet interfaces.
            lldp_med_net_policy_vlan: '(String) Advertised VLAN ID for LLDP-MED Network Policy TLV. This allows assigning a VLAN ID for LLDP-MED capable devices, such as VoIP phones. The TLV will only be added to interfaces where LLDP-MED capable devices are discovered. Other TLV values are predefined and cannot be changed:'
            lldp_poe_power: (Boolean) Two specific TLVs facilitate Power over Ethernet (PoE) management between Power Sourcing Equipment (PSE) and Powered Devices (PD).
            lldp_vlan_info: (Boolean) An option whether to send IEEE 802.1 Organizationally Specific TLVs in LLDP related to VLANs. The setting is available since RouterOS version 7.16.
            mode: (String) Selects the neighbor discovery packet sending and receiving mode. The setting is available since RouterOS version 7.7.
            protocol: (Set of String) List of used discovery protocols.
        importStatements:
            - terraform import routeros_ip_neighbor_discovery_settings.test .
    routeros_ip_pool:
        subCategory: ""
        name: routeros_ip_pool
        title: routeros_ip_pool (Resource)
        argumentDocs:
            comment: (String)
            id: (String) The ID of this resource.
            name: (String) Changing the name of this resource will force it to be recreated.
            next_pool: (String) When address is acquired from pool that has no free addresses, and next-pool property is set to another pool, then next IP address will be acquired from next-pool.
            ranges: '(List of String) IP address list of non-overlapping IP address ranges in form of: ["from1-to1", "from2-to2", ..., "fromN-toN"]. For example, ["10.0.0.1-10.0.0.27", "10.0.0.32-10.0.0.47"]'
        importStatements:
            - terraform import routeros_ip_pool.pool "*1"
    routeros_ip_route:
        subCategory: ""
        name: routeros_ip_route
        title: routeros_ip_route (Resource)
        argumentDocs:
            active: (Boolean) A flag indicates whether the route is elected as Active and eligible to be added to the FIB.
            blackhole: (Boolean) It's a blackhole route. If you need to cancel route marking, then simply delete the parameter from the configuration of the TF. The value of the parameter (true or false) has no effect on the MT processing logic.
            check_gateway: (String) Currently used check-gateway option.
            comment: (String)
            connect: (Boolean) The route is directly reachable.
            dhcp: (Boolean) A flag indicates whether the route was added by the DHCP service.
            disabled: (Boolean)
            distance: (Number) Value used in route selection. Routes with smaller distance value are given preference.
            dst_address: (String) IP prefix of route, specifies destination addresses that this route can be used for.
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            ecmp: (Boolean) A flag indicates whether the route is added as an Equal-Cost Multi-Path route in the FIB.
            gateway: (String) Array of IP addresses or interface names. Specifies which host or interface packets should be sent to (IP | interface | IP%interface | IP@table[, IP | string, [..]]).
            hw_offloaded: (Boolean) Indicates whether the route is eligible to be hardware offloaded on supported hardware.
            id: (String) The ID of this resource.
            immediate_gw: (String) Shows actual (resolved) gateway and interface that will be used for packet forwarding.
            inactive: (Boolean)
            local_address: (String) Local IP address of the connected network.
            pref_src: (String) Which of the local IP addresses to use for locally originated packets that are sent via this route. Value of this property has no effect on forwarded packets. If value of this property is set to IP address that is not local address of this router then the route will be inactive (in ROS v6, ROS v7 allows IP spoofing).
            routing_table: (String) Routing table this route belongs to.
            scope: (Number) Used in nexthop resolution. Route can resolve nexthop only through routes that have scope less than or equal to the target-scope of this route.
            static: (Boolean)
            suppress_hw_offload: (Boolean)
            target_scope: (Number) Used in nexthop resolution. This is the maximum value of scope for a route through which a nexthop of this route can be resolved.
            vrf_interface: (String) VRF interface name.
        importStatements:
            - terraform import routeros_ip_route.a_route "*0"
            - terraform import routeros_ip_route.a_route "name=xxx"
    routeros_ip_service:
        subCategory: ""
        name: routeros_ip_service
        title: routeros_ip_service (Resource)
        argumentDocs:
            address: (String) List of IP/IPv6 prefixes from which the service is accessible.
            certificate: (String) The name of the certificate used by a particular service. Applicable only for services that depend on certificates ( www-ssl, api-ssl ).
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            id: (String) The ID of this resource.
            invalid: (Boolean)
            max_sessions: (Number) Maximum number of concurrent connections to a particular service. This option is available in RouterOS starting from version 7.16.
            name: (String) Service name.
            numbers: (String) The name of the service whose settings will be changed ( api, api-ssl, ftp, ssh, telnet, winbox, www, www-ssl ).
            port: (Number) The port particular service listens on.
            proto: (String)
            tls_version: (String) Specifies which TLS versions to allow by a particular service.
            vrf: (String) The VRF table this resource operates on.
        importStatements:
            - terraform import routeros_ip_service.www_ssl www-ssl
            - terraform import routeros_ip_service.www_ssl "name=xxx"
    routeros_ip_settings:
        subCategory: ""
        name: routeros_ip_settings
        title: routeros_ip_settings (Resource)
        argumentDocs:
            accept_redirects: (Boolean) Whether to accept ICMP redirect messages. Typically should be enabled on the host and disabled on routers.
            accept_source_route: (Boolean) Whether to accept packets with the SRR option. Typically should be enabled on the router.
            allow_fast_path: (Boolean) Allows Fast Path.
            arp_timeout: (String) Sets Linux base_reachable_time (base_reachable_time_ms) on all interfaces that use ARP. The initial validity of the ARP entry is picked from the interval [timeout/2 - 3*timeout/2] (default from 15s to 45s) after the neighbor was found. Can use postfix ms, s, m, h, d for milliseconds, seconds, minutes, hours, or days. if no postfix is set then seconds (s) are used. The parameter means how long a valid ARP record will be considered complete if no one communicates with the specific MAC/IP during this time. The parameter does not represent a time when an ARP entry is removed from the ARP cache (see max-neighbor-entries setting).
            icmp_errors_use_inbound_interface_address: (Boolean) If enabled, the ICMP error message reply will be sent with the source address equal to primary address of the receiving interface that caused the error . This feature can be useful for complex network debugging.
            icmp_rate_limit: (Number) Limit the maximum rates for sending ICMP packets whose type matches icmp-rate-mask to specific targets. `0` disables any limiting, other values indicate the minimum space between responses in milliseconds.
            icmp_rate_mask: (String) Mask made of ICMP types for which rates are being limited.
            id: (String) The ID of this resource.
            ip_forward: (Boolean) Enable/disable packet forwarding between interfaces. Resets all configuration parameters to defaults according to RFC1812 for routers.
            ipv4_multipath_hash_policy: (String) IPv4 Hash policy used for ECMP routing in `/ip/settings` menu
            max_neighbor_entries: (Number) Sets Linux gc_thresh3. A maximum number of allowed neighbors in the ARP table. Since `RouterOS version 7.1`, the default value depends on the installed amount of RAM. It is possible to set a higher value than the default, but it increases the risk of out-of-memory condition.
            route_cache: (Boolean) Disable or enable the Linux route cache. Note that disabling the route cache, will also disable the fast path.
            rp_filter: (String) Disables or enables source validation.
            secure_redirects: (Boolean) Accept ICMP redirect messages only for gateways, listed in the default gateway list.
            send_redirects: (Boolean) Whether to send ICMP redirects. Recommended to be enabled on routers.
            tcp_syncookies: (Boolean) end out syncookies when the syn backlog queue of a socket overflows. This is to prevent the common 'SYN flood attack'. syncookies seriously violate TCP protocol, and disallow the use of TCP extensions, which can result in serious degradation of some services (f.e. SMTP relaying), visible not by you, but to your clients and relays, contacting you.
            tcp_timestamps: (String) Parameter allows to enable/disable TCP timestamps or add random offset to TCP timestamp (default behavior). Disabling timestamps completely may help to reduce spikes of performance drops.
        importStatements:
            - terraform import routeros_ip_settings.settings .
    routeros_ip_smb:
        subCategory: ""
        name: routeros_ip_smb
        title: routeros_ip_smb (Resource)
        argumentDocs:
            comment: (String) Set comment for the server.
            domain: (String) Name of Windows Workgroup.
            enabled: (String) The default value is 'auto'. This means that the SMB server will automatically be enabled when the first non-disabled SMB share is configured under '/ip smb share'.
            id: (String) The ID of this resource.
            interfaces: (Set of String) List of interfaces on which SMB service will be running.
            status: (String)
        importStatements:
            - terraform import routeros_ip_smb.test .
    routeros_ip_ssh_server:
        subCategory: ""
        name: routeros_ip_ssh_server
        title: routeros_ip_ssh_server (Resource)
        argumentDocs:
            allow_none_crypto: (Boolean) Whether to allow connection if cryptographic algorithms are set to none.
            always_allow_password_login: (Boolean) Whether to allow password login at the same time when public key authorization is configured for a user.
            ciphers: (String) Allow to configure SSH ciphers.
            forwarding_enabled: '(String) Allows to control which SSH forwarding method to allow:'
            host_key_size: (Number) RSA key size when host key is being regenerated.
            host_key_type: (String) Select host key type.
            id: (String) The ID of this resource.
            strong_crypto: (Boolean) Use stronger encryption.
        importStatements:
            - terraform import routeros_ip_ssh_server.test .
    routeros_ip_tftp:
        subCategory: ""
        name: routeros_ip_tftp
        title: routeros_ip_tftp (Resource)
        argumentDocs:
            allow: (Boolean) Allow connection.
            allow_overwrite: (Boolean) If `true`, overwriting the file is allowed.
            allow_rollover: (Boolean) If set, server will allow sequence number to roll over when maximum value is reached. This is used to enable large downloads using TFTP server.
            disabled: (Boolean)
            id: (String) The ID of this resource.
            ip_addresses: (Set of String) Range of IP addresses accepted as clients. If empty `0.0.0.0/0` will be used.
            read_only: (Boolean) Sets if file can be written to. If set to `false` write attempts will fail with an error.
            reading_window_size: (String) TFTP Windowsize option value.
            real_filename: (String) If `req-filename` and `real-filename` values are set and valid, the requested filename will be replaced with matched file. This field has to be set. If multiple regex are specified in `req-filename`, with this field you can set which ones should match, so this rule is validated. `real-filename` format for using multiple regex is `filename\0\5\6`.
            req_filename: (String) Requested filename as regular expression (regex) if field is left empty it defaults to `.*`.
        importStatements:
            - terraform import routeros_ip_tftp.file "*0"
    routeros_ip_tftp_settings:
        subCategory: ""
        name: routeros_ip_tftp_settings
        title: routeros_ip_tftp_settings (Resource)
        argumentDocs:
            id: (String) The ID of this resource.
            max_block_size: (Number) Maximum accepted block size value. During transfer negotiation phase, RouterOS device will not negotiate larger value than this.
        importStatements:
            - terraform import routeros_ip_tftp_settings.tftp_settings .
    routeros_ip_traffic_flow:
        subCategory: ""
        name: routeros_ip_traffic_flow
        title: routeros_ip_traffic_flow (Resource)
        argumentDocs:
            active_flow_timeout: (String) Maximum life-time of a flow.
            cache_entries: (String) Number of flows which can be in router's memory simultaneously.
            id: (String) The ID of this resource.
            inactive_flow_timeout: (String) How long to keep the flow active, if it is idle. If a connection does not see any packet within this timeout, then traffic-flow will send a packet out as a new flow. If this timeout is too small it can create a significant amount of flows and overflow the buffer.
            interfaces: (String) Names of those interfaces will be used to gather statistics for traffic-flow. To specify more than one interface, separate them with a comma.
            packet_sampling: (Boolean) Enable or disable packet sampling feature.
            sampling_interval: (Number) The number of packets that are consecutively sampled.
            sampling_space: (Number) The number of packets that are consecutively omitted.
        importStatements:
            - terraform import routeros_ip_traffic_flow.test .
    routeros_ip_traffic_flow_ipfix:
        subCategory: ""
        name: routeros_ip_traffic_flow_ipfix
        title: routeros_ip_traffic_flow_ipfix (Resource)
        argumentDocs:
            bytes: (String) Total number of bytes processed in the flow.
            dst_address: (String) The destination IP address of the flow.
            dst_address_mask: (String) Network mask for the destination address.
            dst_mac_address: (String) Destination MAC address.
            dst_port: (String) Destination port number.
            first_forwarded: (String) Timestamp of the first packet forwarded in a flow.
            gateway: (String) IP address of the gateway through which the flow was routed.
            icmp_code: (String) ICMP code for error messaging and operational information.
            icmp_type: (String) Type of ICMP message, important for diagnostic messages.
            id: (String) The ID of this resource.
            igmp_type: (String) Type of Internet Group Management Protocol operation.
            in_interface: (String) Interface through which packets of the flow are received.
            ip_header_length: (String) Length of the IP header.
            ip_total_lenght: (String) Length of the IP packet in bytes.
            ipv6_flow_label: (String) Label field from an IPv6 header, used to classify flows.
            is_multicast: (String) Indicates whether the flow is a multicast flow.
            last_forwarded: (String) Timestamp of the last packet forwarded in a flow.
            nat_dst_address: (String) Translated destination IP address by NAT.
            nat_dst_port: (String) Translated destination port number by NAT.
            nat_events: (String) Events related to Network Address Translation for the flow.
            nat_src_address: (String) Translated source IP address by NAT.
            nat_src_port: (String) Translated source port number by NAT.
            out_interface: (String) Interface through which packets of the flow are sent out.
            packets: (String) Number of packets processed in the flow.
            protocol: (String) Protocol number (e.g., TCP, UDP, ICMP).
            src_address: (String) The source IP address of the flow.
            src_address_mask: (String) Network mask for the source address, useful in summarizing data.
            src_mac_address: (String) Source MAC address.
            src_port: (String) Source port number.
            sys_init_time: (String) System initialization time, can be used for timing analysis.
            tcp_ack_num: (String) Acknowledgment number in a TCP connection.
            tcp_flags: (String) Flags from the TCP header (e.g., SYN, ACK).
            tcp_seq_num: (String) Sequence number in a TCP connection.
            tcp_window_size: (String) Window size in a TCP connection, indicating the scale of received data buffering.
            tos: (String) Type of Service field in the IP header, indicating priority and handling of the packet.
            ttl: (String) Time To Live for the packet, decremented by each router to prevent infinite loops.
            udp_length: (String) Length of the UDP payload.
        importStatements:
            - terraform import routeros_ip_traffic_flow_ipfix.test .
    routeros_ip_traffic_flow_target:
        subCategory: ""
        name: routeros_ip_traffic_flow_target
        title: routeros_ip_traffic_flow_target (Resource)
        argumentDocs:
            disabled: (Boolean)
            dst_address: (String) IP address of the host which receives Traffic-Flow statistic packets from the router.
            id: (String) The ID of this resource.
            port: (Number) Port (UDP) of the host which receives Traffic-Flow statistic packets from the router.
            src_address: (String) IP address used as source when sending Traffic-Flow statistics.
            v9_template_refresh: (Number) Number of packets after which the template is sent to the receiving host (only for NetFlow version 9 and IPFIX).
            v9_template_timeout: (String) After how long to send the template, if it has not been sent. (only for NetFlow version 9 and IPFIX).
            version: (String) Which version format of NetFlow to use.
        importStatements:
            - terraform import routeros_ip_traffic_flow_target.test *3
            - terraform import routeros_ip_traffic_flow_target.test "dst_address=xxx"
    routeros_ip_upnp:
        subCategory: ""
        description: '*<span style="color:red">If you do not disable the `allow-disable-external-interface`, any user from the local network will be able (without any authentication procedures) to disable the router''s external interface.</span>*'
        name: routeros_ip_upnp
        title: routeros_ip_upnp (Resource)
        argumentDocs:
            allow_disable_external_interface: (Boolean) Whether or not should the users be allowed to disable the router's external interface. This functionality (for users to be able to turn the router's external interface off without any authentication procedure) is required by the standard, but as it is sometimes not expected or unwanted in UPnP deployments which the standard was not designed for (it was designed mostly for home users to establish their own local networks), you can disable this behavior
            enabled: (Boolean) Enable UPnP service.
            id: (String) The ID of this resource.
            show_dummy_rule: (Boolean) Enable a workaround for some broken implementations, which are handling the absence of UPnP rules incorrectly (for example, popping up error messages). This option will instruct the server to install a dummy (meaningless) UPnP rule that can be observed by the clients, which refuse to work correctly otherwise
        importStatements:
            - terraform import routeros_ip_upnp.test .
    routeros_ip_upnp_interfaces:
        subCategory: ""
        name: routeros_ip_upnp_interfaces
        title: routeros_ip_upnp_interfaces (Resource)
        argumentDocs:
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            forced_ip: (String) Allow specifying what public IP to use if the external interface has more than one IP available.
            id: (String) The ID of this resource.
            interface: (String) Interface name on which UPnP will be running.
            type: '(String) UPnP interface type:'
        importStatements:
            - terraform import routeros_ip_upnp_interfaces.test '*1'
            - terraform import routeros_ip_upnp_interfaces.test "name=xxx"
    routeros_ip_vrf:
        subCategory: ""
        name: routeros_ip_vrf
        title: routeros_ip_vrf (Resource)
        argumentDocs:
            comment: (String)
            disabled: (Boolean)
            id: (String) The ID of this resource.
            interfaces: (Set of String) At least one interface must be added to the VRF.
            name: (String) Unique name of the VRF.
        importStatements:
            - terraform import routeros_ip_vrf.test_vrf_a "*0"
            - terraform import routeros_ip_vrf.test_vrf_a "vrf_1"
            - terraform import routeros_ip_vrf.test_vrf_a `"comment=Custom routing"`
    routeros_ipip:
        subCategory: ""
        description: '<!-- schema generated by tfplugindocs --> ## Schema ### Required - `name` (String) Name of the ipip interface. ### Optional - `allow_fast_path` (Boolean) Whether to allow FastPath processing. Must be disabled if IPsec tunneling is used. - `clamp_tcp_mss` (Boolean) Controls whether to change MSS size for received TCP SYN packets. When enabled, a router will change the MSS size for received TCP SYN packets if the current MSS size exceeds the tunnel interface MTU (taking into account the TCP/IP overhead). The received encapsulated packet will still contain the original MSS, and only after decapsulation the MSS is changed. - `comment` (String) - `disabled` (Boolean) - `dont_fragment` (String) - `dscp` (String) Set dscp value in GRE header to a fixed value ''0..63'' or ''inherit'' from dscp value taken from tunnelled traffic. - `ipsec_secret` (String, Sensitive) When secret is specified, router adds dynamic IPsec peer to remote-address with pre-shared key and policy (by default phase2 uses sha1/aes128cbc). - `keepalive` (String) Tunnel keepalive parameter sets the time interval in which the tunnel running flag will remain even if the remote end of tunnel goes down. If configured time,retries fail, interface running flag is removed. Parameters are written in following format: `KeepaliveInterval,KeepaliveRetries` where `KeepaliveInterval` is time interval and `KeepaliveRetries` - number of retry attempts. `KeepaliveInterval` is integer 0..4294967295 - `local_address` (String) Source address of the tunnel packets, local on the router. - `mtu` (String) Layer3 Maximum transmission unit (''auto'', 0 .. 65535). Look for the exact minimum value in the MikroTik documentation - `remote_address` (String) IP address of the remote end of the tunnel. ### Read-Only - `actual_mtu` (Number) - `id` (String) The ID of this resource. - `l2mtu` (Number) Layer2 Maximum transmission unit. [See](https://wiki.mikrotik.com/wiki/Maximum_Transmission_Unit_on_RouterBoards). - `running` (Boolean)'
        name: routeros_ipip
        title: routeros_ipip (Resource)
        argumentDocs:
            actual_mtu: (Number)
            allow_fast_path: (Boolean) Whether to allow FastPath processing. Must be disabled if IPsec tunneling is used.
            clamp_tcp_mss: (Boolean) Controls whether to change MSS size for received TCP SYN packets. When enabled, a router will change the MSS size for received TCP SYN packets if the current MSS size exceeds the tunnel interface MTU (taking into account the TCP/IP overhead). The received encapsulated packet will still contain the original MSS, and only after decapsulation the MSS is changed.
            comment: (String)
            disabled: (Boolean)
            dont_fragment: (String)
            dscp: (String) Set dscp value in GRE header to a fixed value '0..63' or 'inherit' from dscp value taken from tunnelled traffic.
            id: (String) The ID of this resource.
            ipsec_secret: (String, Sensitive) When secret is specified, router adds dynamic IPsec peer to remote-address with pre-shared key and policy (by default phase2 uses sha1/aes128cbc).
            keepalive: '(String) Tunnel keepalive parameter sets the time interval in which the tunnel running flag will remain even if the remote end of tunnel goes down. If configured time,retries fail, interface running flag is removed. Parameters are written in following format: `KeepaliveInterval,KeepaliveRetries` where `KeepaliveInterval` is time interval and `KeepaliveRetries` - number of retry attempts. `KeepaliveInterval` is integer 0..4294967295'
            l2mtu: (Number) Layer2 Maximum transmission unit. [See](https://wiki.mikrotik.com/wiki/Maximum_Transmission_Unit_on_RouterBoards).
            local_address: (String) Source address of the tunnel packets, local on the router.
            mtu: (String) Layer3 Maximum transmission unit ('auto', 0 .. 65535). Look for the exact minimum value in the MikroTik documentation
            name: (String) Name of the ipip interface.
            remote_address: (String) IP address of the remote end of the tunnel.
            running: (Boolean)
        importStatements: []
    routeros_ipv6_address:
        subCategory: ""
        name: routeros_ipv6_address
        title: routeros_ipv6_address (Resource)
        argumentDocs:
            actual_interface: (String) Name of the actual interface the logical one is bound to.
            address: (String) IPv6 address. Using the eui_64 and from_pool options can transform the original address! [See docs](https://wiki.mikrotik.com/wiki/Manual:IPv6/Address#Properties)
            advertise: (Boolean) Whether to enable stateless address configuration. The prefix of that address is automatically advertised to hosts using ICMPv6 protocol. The option is set by default for addresses with prefix length 64.
            auto_link_local: (Boolean) If newly created address is manual link-local address this setting allows to override dynamically created IPv6 link-local address.
            comment: (String)
            deprecated: (Boolean) Whether address is deprecated
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            eui_64: (Boolean) Whether to calculate EUI-64 address and use it as last 64 bits of the IPv6 address.
            from_pool: (String) Name of the pool from which prefix will be taken to construct IPv6 address taking last part of the address from address property.
            global: (Boolean) Whether address is global.
            id: (String) The ID of this resource.
            interface: (String) Name of the interface.
            invalid: (Boolean)
            link_local: (Boolean) Whether address is link local.
            no_dad: (Boolean) If set indicates that address is anycast address and Duplicate Address Detection should not be performed.
            slave: (Boolean) Whether address belongs to an interface which is a slave port to some other master interface
        importStatements:
            - terraform import routeros_ipv6_address.ipv6_address "*0"
    routeros_ipv6_dhcp_client:
        subCategory: ""
        name: routeros_ipv6_dhcp_client
        title: routeros_ipv6_dhcp_client (Resource)
        argumentDocs:
            accept_prefix_without_address: (Boolean)
            add_default_route: (Boolean) Whether to add default IPv6 route after a client connects.
            address: (String) IPv6 address, which is assigned to DHCPv6 Client from the Server.
            allow_reconfigure: (Boolean) Allow reconfigure messages.
            check_gateway: (String) Method on how to check gateway reachability.
            comment: (String)
            custom_iana_id: (String) Allow to specify custom IANA ID.
            custom_iapd_id: (String) Allow to specify custom IAPD ID.
            default_route_distance: (Number) Distance of default route. Applicable if add-default-route is set to yes.
            default_route_tables: (Set of String) List of routing tables to which default route must be added. Table name can be proceeded with ":x" where x would be the distance for the route to be installed with.
            dhcp_options: (Set of String) Options that are sent to the DHCP server.
            dhcp_server_v6: (String) The IPv6 address of the DHCP server
            disabled: (Boolean)
            duid: (String) Auto-generated DUID that is sent to the server. DUID is generated using one of the MAC addresses available on the router.
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            expires_after: (String) A time when the IPv6 prefix expires (specified by the DHCPv6 server).
            gateway: (String) The IP address of the gateway which is assigned by DHCP server.
            id: (String) The ID of this resource.
            interface: (String) Name of the interface.
            invalid: (Boolean)
            pool_name: (String) Name of the IPv6 pool in which received IPv6 prefix will be added
            pool_prefix_length: (Number) Prefix length parameter that will be set for IPv6 pool in which received IPv6 prefix is added. Prefix length must be greater than the length of the received prefix, otherwise, prefix-length will be set to received prefix length + 8 bits.
            prefix: (String) Shows received IPv6 prefix from DHCPv6-PD server
            prefix_address_lists: (Set of String) Names of the firewall address lists to which received prefix will be added.
            prefix_hint: (String) Include a preferred prefix length.
            rapid_commit: (Boolean) Enable DHCP rapid commit (fast address assignment)
            request: (List of String) To choose if the DHCPv6 request will ask for the address, info or the IPv6 prefix.
            script: '(String) Run this script on the DHCP-client status change. Available variables:'
            status: '(String) Shows the status of DHCPv6 Client:'
            use_interface_duid: (Boolean) Specifies the MAC address of the specified interface as the DHCPv6 client DUID.
            use_peer_dns: (Boolean) Whether to accept the DNS settings advertised by the IPv6 DHCP Server.
            validate_server_duid: (Boolean) Whether to validate the DUID of the IPv6 DHCP Server.
