    routeros_interface_vlan:
        subCategory: ""
        name: routeros_interface_vlan
        title: routeros_interface_vlan (Resource)
        argumentDocs:
            arp: '(String) Address Resolution Protocol mode:'
            arp_timeout: (String) ARP timeout is time how long ARP record is kept in ARP table after no packets are received from IP. Value auto equals to the value of arp-timeout in IP/Settings, default is 30s. Can use postfix `ms`, `s`, `m`, `h`, `d` for milliseconds, seconds, minutes, hours or days. If no postfix is set then seconds (s) is used.
            comment: (String)
            disabled: (Boolean)
            hw_offloaded: (Boolean)
            id: (String) The ID of this resource.
            interface: (String) Name of the interface.
            l2mtu: (Number) Layer2 Maximum transmission unit. [See](https://wiki.mikrotik.com/wiki/Maximum_Transmission_Unit_on_RouterBoards).
            loop_protect: (String)
            loop_protect_disable_time: (String)
            loop_protect_send_interval: (String)
            loop_protect_status: (String)
            mac_address: (String) Current mac address.
            mtu: (String) Layer3 Maximum transmission unit ('auto', 0 .. 65535). Look for the exact minimum value in the MikroTik documentation
            mvrp: (Boolean) Specifies whether this VLAN should declare its attributes through Multiple VLAN Registration Protocol (MVRP) as an applicant (available since RouterOS 7.15). It can be used to register the VLAN with connected bridges that support MVRP. This property only has an effect when use-service-tag is disabled.
            name: (String) Changing the name of this resource will force it to be recreated.
            running: (Boolean)
            use_service_tag: (Boolean)
            vlan_id: (Number) Virtual LAN identifier or tag that is used to distinguish VLANs. Must be equal for all computers that belong to the same VLAN.
        importStatements:
            - terraform import routeros_interface_vlan.interface_vlan "*1"
            - terraform import routeros_interface_vlan.interface_vlan "name=xxx"
    routeros_interface_vrrp:
        subCategory: ""
        name: routeros_interface_vrrp
        title: routeros_interface_vrrp (Resource)
        argumentDocs:
            arp: '(String) Address Resolution Protocol mode:'
            arp_timeout: (String) ARP timeout is time how long ARP record is kept in ARP table after no packets are received from IP. Value auto equals to the value of arp-timeout in IP/Settings, default is 30s. Can use postfix `ms`, `s`, `m`, `h`, `d` for milliseconds, seconds, minutes, hours or days. If no postfix is set then seconds (s) is used.
            authentication: (String) Authentication method to use for VRRP advertisement packets.
            comment: (String)
            connection_tracking_mode: (String) Specifies the mode for connection tracking synchronization. This setting is only relevant when `sync-connection-tracking=yes` is enabled.
            connection_tracking_port: (Number) Specifies UDP port for connection tracking synchronization. This setting is only relevant when `sync-connection-tracking=yes` is enabled.
            disabled: (Boolean)
            group_authority: (String) Allows combining multiple VRRP interfaces to maintain the same VRRP status within the group. `group_authority` was previously called `group_master`, `group_master` is kept for compatibility with scripts, but if both are set only `group_authority` will be taken into account.
            group_master: (String) Allows combining multiple VRRP interfaces to maintain the same VRRP status within the group. `group_authority` was previously called `group_master`, `group_master` is kept for compatibility with scripts, but if both are set only `group_authority` will be taken into account.
            id: (String) The ID of this resource.
            interface: (String) Name of the interface.
            interval: (String) VRRP update interval in seconds. Defines how often master sends advertisement packets.
            invalid: (Boolean)
            mac_address: (String) Current mac address.
            mtu: (Number) Layer2 Maximum transmission unit. [See](https://wiki.mikrotik.com/wiki/Maximum_Transmission_Unit_on_RouterBoards).
            name: (String) Changing the name of this resource will force it to be recreated.
            on_backup: (String) Script to execute when the node is switched to the backup state.
            on_fail: (String) Script to execute when the node fails.
            on_master: (String) Script to execute when the node is switched to master state.
            password: (String, Sensitive) Password required for authentication. Can be ignored if authentication is not used.
            preemption_mode: (Boolean) Whether the master node always has the priority. When set to `no` the backup node will not be elected to be a master until the current master fails, even if the backup node has higher priority than the current master. This setting is ignored if the owner router becomes available
            priority: (Number) Priority of VRRP node used in Master election algorithm. A higher number means higher priority. `255` is reserved for the router that owns VR IP and `0` is reserved for the Master router to indicate that it is releasing responsibility.
            remote_address: (String) Specifies the remote address of the other VRRP router for syncing connection tracking. If not set, the system autodetects the remote address via VRRP. The remote address is used only if `sync_connection_tracking = true`.Sync connection tracking uses UDP port 8275.
            running: (Boolean)
            sync_connection_tracking: (Boolean) Synchronize connection tracking entries from Master to Backup device.
            v3_protocol: (String) A protocol that will be used by VRRPv3. Valid only if the version is 3.
            version: (Number) Which VRRP version to use.
            vrid: (Number) Virtual Router identifier. Each Virtual router must have a unique id number.
        importStatements:
            - terraform import routeros_interface_vrrp.interface_vrrp "*0"
            - terraform import routeros_interface_vrrp.interface_vrrp "name=xxx"
    routeros_interface_vxlan:
        subCategory: ""
        name: routeros_interface_vxlan
        title: routeros_interface_vxlan (Resource)
        argumentDocs:
            allow_fast_path: (Boolean) Whether to allow Fast Path processing. Fragmented and flooded packets over VXLAN are redirected via a slow path. Fast Path is disabled for VXLAN interface that uses IPv6 VTEP version or VRF. The setting is available since RouterOS version 7.8.
            arp: '(String) Address Resolution Protocol mode:'
            arp_timeout: (String) ARP timeout is time how long ARP record is kept in ARP table after no packets are received from IP. Value auto equals to the value of arp-timeout in IP/Settings, default is 30s. Can use postfix `ms`, `s`, `m`, `h`, `d` for milliseconds, seconds, minutes, hours or days. If no postfix is set then seconds (s) is used.
            checksum: '(Boolean) Setting controls whether a UDP checksum is calculated in the transmitted outer VXLAN packets:'
            comment: (String)
            disabled: (Boolean)
            dont_fragment: '(String) The Don''t Fragment (DF) flag controls whether a packet can be broken into smaller packets, called fragments, before being sent over a network. When configuring VXLAN, this setting determines the presence of the DF flag on the outer IPv4 header and can control packet fragmentation if the encapsulated packet exceeds the outgoing interface MTU. This setting has three options:'
            group: (String) When specified, a multicast group address can be used to forward broadcast, unknown-unicast, and multicast traffic between VTEPs. This property requires specifying the interface setting. The interface will use IGMP or MLD to join the specified multicast group, make sure to add the necessary PIM and IGMP/MDL configuration. When this property is set, the vteps-ip-version automatically gets updated to the used multicast IP version.
            hw: (Boolean)
            hw_offloaded: (Boolean) Indicates whether the route is eligible to be hardware offloaded on supported hardware.
            id: (String) The ID of this resource.
            interface: (String) Interface name used for multicast forwarding. This property requires specifying the group setting.
            l2mtu: (Number) Layer2 Maximum transmission unit. [See](https://wiki.mikrotik.com/wiki/Maximum_Transmission_Unit_on_RouterBoards).
            learning: (Boolean) Setting controls whether inner source MAC addresses and remote VTEP IP/IPv6 addresses are learned dynamically from received packets.
            local_address: (String) Specifies the local source address for the VXLAN interface. If not set, one IP address of the egress interface will be selected as a source address for VXLAN packets. When the property is set, the vteps-ip-version automatically gets updated to the used local IP version. The setting is available since RouterOS version 7.7.
            loop_protect: (String)
            loop_protect_disable_time: (String)
            loop_protect_send_interval: (String)
            loop_protect_status: (String)
            mac_address: (String) Static MAC address of the interface. A randomly generated MAC address will be assigned when not specified.
            max_fdb_size: (Number) Limits the maximum number of MAC addresses that VXLAN can store in the forwarding database (FDB).
            mtu: (String) Layer3 Maximum transmission unit ('auto', 0 .. 65535). Look for the exact minimum value in the MikroTik documentation
            name: (String) Name of the interface.
            "no": '- the UDP checksum is set to zero in transmitted outer packets. This also allows receiving VXLAN packets over IPv6 that have a zero UDP checksum.'
            port: (Number) Used UDP port number.
            rem_csum: (String) Changes the Remote Checksum Offload (RCO) settings for VXLAN interface. RCO is a technique for eliding the inner checksum of an encapsulated datagram, allowing the outer checksum to be offloaded by network driver. It does, however, involve a change to the encapsulation protocols, which the receiver must also support. For this reason, it is disabled by default and setting is available to ensure compatibility with systems that rely on this feature.
            running: (Boolean)
            ttl: (String)
            vni: (Number) VXLAN Network Identifier (VNI).
            vrf: (String) The VRF table this resource operates on.
            vteps_ip_version: (String) Used IP protocol version for statically configured VTEPs. The RouterOS VXLAN interface does not support dual-stack, any configured remote VTEPs with the opposite IP version will be ignored. When multicast group or local-address properties are set, the vteps-ip-version automatically gets updated to the used IP version. The setting is available since RouterOS version 7.6.
            "yes": '- the UDP checksum is calculated in transmitted outer packets.'
        importStatements:
            - terraform import routeros_interface_vxlan.test *3
            - terraform import routeros_interface_vxlan.test "name=vxlan1"
    routeros_interface_vxlan_vteps:
        subCategory: ""
