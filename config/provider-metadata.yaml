            raw_value: (String) raw_value is computed from value.
            value: (String) The dhcp-client option
        importStatements: []
    routeros_dhcp_server:
        subCategory: ""
        description: '#### This is an alias for backwards compatibility between plugin versions. Please see documentation for [routeros_ip_dhcp_server](ip_dhcp_server.md)'
        name: routeros_dhcp_server
        title: routeros_dhcp_server (Resource)
        argumentDocs: {}
