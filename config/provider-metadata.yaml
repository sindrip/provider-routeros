    routeros_tool_netwatch:
        subCategory: ""
        name: routeros_tool_netwatch
        title: routeros_tool_netwatch (Resource)
        argumentDocs:
            accept_icmp_time_exceeded: (Boolean) If the ICMP `time exceeded` message should be considered a valid response.
            comment: (String)
            disabled: (Boolean)
            dns_server: (String) The DNS server that the probe should send its requests to, if not specified it will use the value from `/ip dns`.
            down_script: (String) Script to execute on the event of probe state change `OK` --> `fail`.
            early_failure_detection: (Boolean) Netwatch will not wait to finish all the packets to be processed to change probe status if it is already known that host will be considered as `down`.
            early_success_detection: (Boolean) Netwatch will not wait to finish all the packets to be processed to change probe status if it is already known that host will be considered as `up`.
            host: '(String) The IP address of the server to be probed. Formats:'
            http_code_max: (Number) Response in the range [http-code-min , http-code-max] is a probe pass/OK; outside - a probe fail. See [mozilla-http-status](https://developer.mozilla.org/en-US/docs/Web/HTTP/Status) or [rfc7231](https://datatracker.ietf.org/doc/html/rfc7231#section-6).
            http_code_min: (Number) OK/fail criteria for HTTP response code.
            id: (String) The ID of this resource.
            interval: (String) The time interval between probe tests.
            name: (String) Task name.
            packet_count: (Number) Total count of ICMP packets to send out within a single test.
            packet_interval: (String) The time between ICMP-request packet send.
            packet_size: (Number) The total size of the IP ICMP packet.
            port: (Number) TCP port (for both tcp-conn and http-get probes)
            record_type: (String) Record type that will be used for DNS probe.
            src_address: (String) Source IP address which the Netwatch will try to use in order to reach the host. If address is not present, then the host will be considered as `down`.
            start_delay: (String) Time to wait before starting probe (on add, enable, or system start).
            startup_delay: (String) Time to wait until starting Netwatch probe after system startup.
            test_script: (String) Script to execute at the end of every probe test.
            thr_avg: (String) Fail threshold for rtt-avg.
            thr_http_time: (String) Fail threshold for http-resp-time.
            thr_jitter: (String) Fail threshold for rtt-jitter.
            thr_loss_count: (Number) Fail threshold for loss-count.
            thr_loss_percent: (Number) Fail threshold for loss-percent.
            thr_max: (String) Fail threshold for rtt-max (a value above thr-max is a probe fail).
            thr_stdev: (String) Fail threshold for rtt-stdev.
            thr_tcp_conn_time: (String) Fail threshold for tcp-connect-time, the configuration uses microseconds, if the time unit is not specified (s/m/h), log and status pages display the same value in milliseconds.
            timeout: (String) Max time limit to wait for a response.
            ttl: (Number) Manually set time to live value for ICMP packet.
            type: '(String) Type of the probe:'
            up_script: (String) Script to execute on the event of probe state change `fail` --> `OK`.
        importStatements:
            - terraform import routeros_tool_netwatch.test *3
            - terraform import routeros_tool_netwatch.test "name=xxx"
    routeros_tool_sniffer:
        subCategory: ""
        name: routeros_tool_sniffer
        title: routeros_tool_sniffer (Resource)
        argumentDocs:
            enabled: (Boolean) Start packet capture.
            file_limit: (Number) File size limit. Sniffer will stop when a limit is reached.
            file_name: (String) Name of the file where sniffed packets will be saved.
            filter_cpu: (String) CPU core used as a filter.
            filter_direction: (String) Specifies which direction filtering will be applied.
            filter_dst_ip_address: (Set of String) Up to 16 IP destination addresses used as a filter.
            filter_dst_ipv6_address: (Set of String) Up to 16 IPv6 destination addresses used as a filter.
            filter_dst_mac_address: (Set of String) Up to 16 MAC destination addresses and MAC address masks used as a filter.
            filter_dst_port: (Set of String) Up to 16 comma-separated destination ports used as a filter. A list of predefined port names is also available, like ssh and telnet.
            filter_interface: (Set of String) Interface name on which sniffer will be running. all indicates that the sniffer will sniff packets on all interfaces.
            filter_ip_address: (Set of String) Up to 16 IP addresses used as a filter.
            filter_ip_protocol: '(Set of String) Up to 16 comma-separated IP/IPv6 protocols used as a filter. IP protocols (instead of protocol names, protocol numbers can be used):'
            filter_ipv6_address: (Set of String) Up to 16 IPv6 addresses used as a filter.
            filter_mac_address: (Set of String) Up to 16 MAC addresses and MAC address masks used as a filter.
            filter_mac_protocol: '(Set of String) Up to 16 comma separated entries used as a filter. Mac protocols (instead of protocol names, protocol number can be used):'
            filter_operator_between_entries: (String) Changes the logic for filters with multiple entries.
            filter_port: (Set of String) Up to 16 comma-separated ports used as a filter. A list of predefined port names is also available, like ssh and telnet.
            filter_size: (String) Filters packets of specified size or size range in bytes.
            filter_src_ip_address: (Set of String) Up to 16 IP source addresses used as a filter.
            filter_src_ipv6_address: (Set of String) Up to 16 IPv6 source addresses used as a filter.
            filter_src_mac_address: (Set of String) Up to 16 MAC source addresses and MAC address masks used as a filter.
            filter_src_port: (Set of String) Up to 16 comma-separated source ports used as a filter. A list of predefined port names is also available, like ssh and telnet.
            filter_stream: (Boolean) Sniffed packets that are devised for the sniffer server are ignored.
            filter_vlan: (Set of Number) Up to 16 VLAN IDs used as a filter.
            id: (String) The ID of this resource.
            max_packet_size: (Number)
            memory_limit: (Number) Memory amount used to store sniffed data.
            memory_scroll: (Boolean) Whether to rewrite older sniffed data when the memory limit is reached.
            only_headers: (Boolean) Save in the memory only the packet's headers, not the whole packet.
            running: (Boolean)
            streaming_enabled: (Boolean) Defines whether to send sniffed packets to the streaming server.
            streaming_server: (String) Tazmen Sniffer Protocol (TZSP) stream receiver.
        importStatements:
            - terraform import routeros_tool_sniffer.test .
