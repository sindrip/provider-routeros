            - terraform import routeros_interface_vxlan_vteps.test "interface=vxlan2-test"
    routeros_interface_w60g:
        subCategory: ""
        name: routeros_interface_w60g
        title: routeros_interface_w60g (Resource)
        argumentDocs:
            arp: '(String) Address Resolution Protocol mode:'
            arp_timeout: (String) ARP timeout is time how long ARP record is kept in ARP table after no packets are received from IP. Value auto equals to the value of arp-timeout in IP/Settings, default is 30s. Can use postfix `ms`, `s`, `m`, `h`, `d` for milliseconds, seconds, minutes, hours or days. If no postfix is set then seconds (s) is used.
            comment: (String)
            disabled: (Boolean)
            frequency: (String) Frequency used in communication (Only active on bridge device).
            id: (String) The ID of this resource.
            isolate_stations: (Boolean) Don't allow communication between connected clients (from RouterOS 6.41).
            l2mtu: (Number) Layer2 Maximum transmission unit. [See](https://wiki.mikrotik.com/wiki/Maximum_Transmission_Unit_on_RouterBoards).
            mac_address: (String) MAC address of the radio interface.
            mdmg_fix: (Boolean) Experimental feature working only on wAP60Gx3 devices, providing better point to multi point stability in some cases.
            mode: (String) Operation mode.
            mtu: (String) Layer3 Maximum transmission unit ('auto', 0 .. 65535). Look for the exact minimum value in the MikroTik documentation
            name: (String) Name of the interface.
            password: (String, Sensitive) Password used for AES encryption.
            put_stations_in_bridge: (String) Put newly created station device interfaces in this bridge.
            region: (String) Parameter to limit frequency use.
            running: (Boolean)
            scan_list: (Set of String) Scan list to limit connectivity over frequencies in station mode.
            ssid: (String) SSID (service set identifier) is a name that identifies wireless network (0..32 char).
            tx_sector: (Number) Disables beamforming and locks to selected radiation pattern.
        importStatements:
            - terraform import routeros_interface_w60g.test *3
            - terraform import routeros_interface_w60g.test "name=xxx"
    routeros_interface_w60g_station:
        subCategory: ""
        name: routeros_interface_w60g_station
        title: routeros_interface_w60g_station (Resource)
        argumentDocs:
            arp: '(String) Address Resolution Protocol mode:'
            arp_timeout: (String) ARP timeout is time how long ARP record is kept in ARP table after no packets are received from IP. Value auto equals to the value of arp-timeout in IP/Settings, default is 30s. Can use postfix `ms`, `s`, `m`, `h`, `d` for milliseconds, seconds, minutes, hours or days. If no postfix is set then seconds (s) is used.
            disabled: (Boolean)
            id: (String) The ID of this resource.
            mac_address: (String) MAC address of the station interface.
            mtu: (String) Layer3 Maximum transmission unit ('auto', 0 .. 65535). Look for the exact minimum value in the MikroTik documentation
            name: (String) Name of the interface.
            parent: (String) Parent interface name.
            put_in_bridge: (String) Add station device interface to specific bridge.
            remote_address: (String) MAC address of bridge interface, station is connecting to.
            running: (Boolean)
        importStatements:
            - terraform import routeros_interface_w60g_station.test *3
            - terraform import routeros_interface_w60g_station.test "name=xxx"
    routeros_interface_wireguard:
        subCategory: ""
        name: routeros_interface_wireguard
        title: routeros_interface_wireguard (Resource)
        argumentDocs:
            comment: (String)
            disabled: (Boolean)
            id: (String) The ID of this resource.
            listen_port: (Number) Port for WireGuard service to listen on for incoming sessions.
            mtu: (String) Layer3 Maximum transmission unit ('auto', 0 .. 65535). Look for the exact minimum value in the MikroTik documentation
            name: (String) Changing the name of this resource will force it to be recreated.
            private_key: (String, Sensitive) A base64 private key. If not specified, it will be automatically generated upon interface creation.
            public_key: (String) A base64 public key is calculated from the private key.
            running: (Boolean)
        importStatements:
            - terraform import routeros_interface_wireguard.test_wg_interface "*1"
            - terraform import routeros_interface_wireguard.test_wg_interface "name=xxx"
    routeros_interface_wireguard_peer:
        subCategory: ""
        name: routeros_interface_wireguard_peer
        title: routeros_interface_wireguard_peer (Resource)
        argumentDocs:
            allowed_address: (List of String) List of IP (v4 or v6) addresses with CIDR masks from which incoming traffic for this peer is allowed and to which outgoing traffic for this peer is directed. The catch-all 0.0.0.0/0 may be specified for matching all IPv4 addresses, and ::/0 may be specified for matching all IPv6 addresses.
            client_address: (String) When imported using a qr code for a client (for example, a phone), then this address for the wg interface is set on that device.
            client_dns: (String) Specify when using WireGuard Server as a VPN gateway for peer traffic.
            client_endpoint: (String) The IP address and port number of the WireGuard Server.
            client_keepalive: (String) Same as persistent-keepalive but from peer side.
            client_listen_port: (Number) The local port upon which this WireGuard tunnel will listen for incoming traffic from peers, and the port from which it will source outgoing packets.
            comment: (String)
            current_endpoint_address: (String) The most recent source IP address of correctly authenticated packets from the peer.
            current_endpoint_port: (Number) The most recent source IP port of correctly authenticated packets from the peer.
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            endpoint_address: (String) An endpoint IP or hostname can be left blank to allow remote connection from any address.
            endpoint_port: (String) An endpoint port can be left blank to allow remote connection from any port.
            id: (String) The ID of this resource.
            interface: (String) Name of the interface.
            is_responder: (Boolean) Specifies if peer is intended to be connection initiator or only responder. Should be used on WireGuard devices that are used as `servers` for other devices as clients to connect to. Otherwise router will all repeatedly try to connect `endpoint-address` or `current-endpoint-address` causing unnecessary system logs to be written.
            last_handshake: (String) Time in seconds after the last successful handshake.
            name: (String) Name of the tunnel.
            persistent_keepalive: (String) A seconds interval, between 1 and 65535 inclusive, of how often to send an authenticated empty packet to the peer for the purpose of keeping a stateful firewall or NAT mapping valid persistently. For example, if the interface very rarely sends traffic, but it might at anytime receive traffic from a peer, and it is behind NAT, the interface might benefit from having a persistent keepalive interval of 25 seconds.
            preshared_key: (String, Sensitive) A **base64** preshared key. Optional, and may be omitted. This option adds an additional layer of symmetric-key cryptography to be mixed into the already existing public-key cryptography, for post-quantum resistance.
            private_key: (String) A base64 private key. If not specified, it will be automatically generated upon interface creation.
            public_key: (String) The remote peer's calculated public key.
            rx: (String) The total amount of bytes received from the peer.
            tx: (String) The total amount of bytes transmitted to the peer.
        importStatements:
            - terraform import routeros_interface_wireguard_peer.wg_peer "*0"
            - terraform import routeros_interface_wireguard_peer.wg_peer "name=xxx"
    routeros_interface_wireless:
        subCategory: ""
        name: routeros_interface_wireless
        title: routeros_interface_wireless (Resource)
        argumentDocs:
            adaptive_noise_immunity: (String) This property is only effective for cards based on Atheros chipset.
            allow_sharedkey: (Boolean) Allow WEP Shared Key clients to connect. Note that no authentication is done for these clients (WEP Shared keys are not compared to anything) - they are just accepted at once (if access list allows that).
            ampdu_priorities: (Set of Number) Frame priorities for which AMPDU sending (aggregating frames and sending using block acknowledgment) should get negotiated and used. Using AMPDUs will increase throughput, but may increase latency, therefore, may not be desirable for real-time traffic (voice, video). Due to this, by default AMPDUs are enabled only for best-effort traffic.
            amsdu_limit: (Number) Max AMSDU that device is allowed to prepare when negotiated. AMSDU aggregation may significantly increase throughput especially for small frames, but may increase latency in case of packet loss due to retransmission of aggregated frame. Sending and receiving AMSDUs will also increase CPU usage.
            amsdu_threshold: (Number) Max frame size to allow including in AMSDU.
            antenna_gain: (Number) Antenna gain in dBi, used to calculate maximum transmit power according to country regulations.
            antenna_mode: '(String) Select antenna to use for transmitting and for receiving: `ant-a` - use only ''a''; antenna `ant-b` - use only ''b''; antenna `txa-rxb` - use antenna ''a'' for transmitting, antenna ''b'' for receiving; `rxa-txb` - use antenna ''b'' for transmitting, antenna ''a'' for receiving.'
            area: (String) Identifies group of wireless networks. This value is announced by AP, and can be matched in  connect-list  by area-prefix. This is a proprietary extension.
            arp: (String) ARP Mode.
            arp_timeout: (String) ARP timeout is time how long ARP record is kept in ARP table after no packets are received from IP. Value auto equals to the value of arp-timeout in `/ip settings`, default is 30s.
            band: (String) Defines set of used data rates, channel frequencies and widths.
            basic_rates_ag: (Set of String) Similar to the basic-rates-b property, but used for 5ghz, 5ghz-10mhz, 5ghz-5mhz, 5ghz-turbo, 2.4ghz-b/g, 2.4ghz-onlyg, 2ghz-10mhz, 2ghz-5mhz and 2.4ghz-g-turbo bands.
            basic_rates_b: (Set of String) List of basic rates, used for `2.4ghz-b`, `2.4ghz-b/g` and `2.4ghz-onlyg` bands.Client will connect to AP only if it supports all basic rates announced by the AP. AP will establish WDS link only if it supports all basic rates of the other AP.This property has effect only in AP modes, and when value of rate-set is configured.
            bridge_mode: (String) Allows to use station-bridge mode.
            burst_time: (String) Time in microseconds which will be used to send data without stopping. Note that no other wireless cards in that network will be able to transmit data during burst-time microseconds. This setting is available only for AR5000, AR5001X, and AR5001X+ chipset based cards.
            channel_width: (String) Use of extension channels (e.g. `C`e, `eC` etc) allows additional 20MHz extension channels and if it should be located below or above the control (main) channel. Extension channel allows 802.11n devices to use up to 40MHz (802.11ac up to 160MHz) of spectrum in total thus increasing max throughput. Channel widths with `XX` and `XXXX` extensions automatically scan for a less crowded control channel frequency based on the number of concurrent devices running in every frequency and chooses the `C` - Control channel frequency automatically.
            comment: (String)
            compression: (Boolean) Setting this property to yes will allow the use of the hardware compression. Wireless interface must have support for hardware compression. Connections with devices that do not use compression will still work.
            country: (String) Limits available bands, frequencies and maximum transmit power for each frequency. Also specifies default value of scan-list. Value no_country_set is an FCC compliant set of channels.
            default_ap_tx_limit: (Number) This is the value of ap-tx-limit for clients that do not match any entry in the  access-list. 0 means no limit.
            default_authentication: (Boolean) For AP mode, this is the value of authentication for clients that do not match any entry in the  access-list. For station mode, this is the value of connect for APs that do not match any entry in the  connect-list.
            default_client_tx_limit: (Number) This is the value of `client-tx-limit` for clients that do not match any entry in the access-list. 0 means no limit.
            default_forwarding: (Boolean) This is the value of forwarding for clients that do not match any entry in the access-list.
            default_name: (String)
            disable_running_check: (Boolean) When set to yes interface will always have running flag. If value is set to no', the router determines whether the card is up and running - for AP one or more clients have to be registered to it, for station, it should be connected to an AP.
            disabled: (Boolean)
            disconnect_timeout: (String) This interval is measured from third sending failure on the lowest data rate. At this point `3 * (hw-retries + 1)` frame transmits on the lowest data rate had failed. During disconnect-timeout packet transmission will be retried with on-fail-retry-time interval. If no frame can be transmitted successfully during disconnect-timeout, the connection is closed, and this event is logged as `extensive data loss`. Successful frame transmission resets this timer.
            distance: '(String) How long to wait for confirmation of unicast frames (ACKs) before considering transmission unsuccessful, or in short ACK-Timeout. Distance value has these behaviors:'
            frame_lifetime: (Number) Discard frames that have been queued for sending longer than frame-lifetime. By default, when value of this property is 0, frames are discarded only after connection is closed.
            frequency: '(String) Channel frequency value in MHz on which AP will operate. Allowed values depend on the selected band, and are restricted by country setting and wireless card capabilities. This setting has no effect if interface is in any of station modes, or in wds-slave mode, or if DFS is active.Note: If using mode `superchannel`.'
            frequency_mode: '(String) Three frequency modes are available:'
            frequency_offset: (Number) Allows to specify offset if the used wireless card operates at a different frequency than is shown in RouterOS, in case a frequency converter is used in the card. So if your card works at 4000MHz but RouterOS shows 5000MHz, set offset to 1000MHz and it will be displayed correctly. The value is in MHz and can be positive or negative.
            guard_interval: (String) Whether to allow use of short guard interval (refer to 802.11n MCS specification to see how this may affect throughput). `any` will use either short or long, depending on data rate, `long` will use long.
            hide_ssid: (Boolean) `true` - AP does not include SSID in the beacon frames, and does not reply to probe requests that have broadcast SSID. `false` - AP includes SSID in the beacon frames, and replies to probe requests that have broadcast SSID.This property has an effect only in AP mode. Setting it to yes can remove this network from the list of wireless networks that are shown by some client software. Changing this setting does not improve the security of the wireless network, because SSID is included in other frames sent by the AP.
            ht_basic_mcs: (Set of String) Modulation and Coding Schemes that every connecting client must support. Refer to 802.11n for MCS specification.
            ht_supported_mcs: (Set of String) Modulation and Coding Schemes that this device advertises as supported. Refer to 802.11n for MCS specification.
            hw_fragmentation_threshold: (String) Specifies maximum fragment size in bytes when transmitted over the wireless medium. 802.11 standard packet (MSDU in 802.11 terminologies) fragmentation allows packets to be fragmented before transmitting over a wireless medium to increase the probability of successful transmission (only fragments that did not transmit correctly are retransmitted). Note that transmission of a fragmented packet is less efficient than transmitting unfragmented packet because of protocol overhead and increased resource usage at both - transmitting and receiving party.
            hw_protection_mode: (String) Frame protection support property.
            hw_protection_threshold: (Number) Frame protection support property read more >>.
            hw_retries: (Number) Number of times sending frame is retried without considering it a transmission failure. Data-rate is decreased upon failure and the frame is sent again. Three sequential failures on the lowest supported rate suspend transmission to this destination for the duration of on-fail-retry-time. After that, the frame is sent again. The frame is being retransmitted until transmission success, or until the client is disconnected after disconnect-timeout. The frame can be discarded during this time if frame-lifetime is exceeded.
            id: (String) The ID of this resource.
            installation: (String) Adjusts scan-list to use indoor, outdoor or all frequencies for the country that is set.
            interface_type: (String)
            interworking_profile: (String)
            keepalive_frames: (String) Applies only if wireless interface is in `mode = ap-bridge`. If a client has not communicated for around 20 seconds, AP sends a `keepalive-frame`. Note, disabling the feature can lead to `ghost` clients in registration-table.
            l2mtu: (Number) Layer2 Maximum transmission unit. [See](https://wiki.mikrotik.com/wiki/Maximum_Transmission_Unit_on_RouterBoards).
            mac_address: (String) MAC address.
            master_interface: (String) Name of wireless interface that has virtual-ap capability. Virtual AP interface will only work if master interface is in ap-bridge, bridge, station or wds-slave mode. This property is only for virtual AP interfaces.
            max_station_count: (Number) Maximum number of associated clients. WDS links also count toward this limit.
            mode: (String) Selection between different station and access point (AP) modes.
            mtu: (String) Layer3 Maximum transmission unit ('auto', 0 .. 65535). Look for the exact minimum value in the MikroTik documentation
            multicast_buffering: (String) For a client that has power saving, buffer multicast packets until next beacon time. A client should wake up to receive a beacon, by receiving beacon it sees that there are multicast packets pending, and it should wait for multicast packets to be sent.
            multicast_helper: (String) When set to full, multicast packets will be sent with a unicast destination MAC address, resolving  multicast problem on the wireless link. This option should be enabled only on the access point, clients should be configured in station-bridge mode. Available starting from v5.15.disabled - disables the helper and sends multicast packets with multicast destination MAC addressesdhcp - dhcp packet mac addresses are changed to unicast mac addresses prior to sending them outfull - all multicast packet mac address are changed to unicast mac addresses prior to sending them outdefault - default choice that currently is set to dhcp. Value can be changed in future releases.
            name: (String) Name of the interface.
            noise_floor_threshold: (String) For advanced use only, as it can badly affect the performance of the interface. It is possible to manually set noise floor threshold value. By default, it is dynamically calculated. This property also affects received signal strength. This property is only effective on non-AC chips.
            nv2_cell_radius: '(Number) Setting affects the size of contention time slot that AP allocates for clients to initiate connection and also size of time slots used for estimating distance to client. When setting is too small, clients that are farther away may have trouble connecting and/or disconnect with `ranging timeout` error. Although during normal operation the effect of this setting should be negligible, in order to maintain maximum performance, it is advised to not increase this setting if not necessary, so AP is not reserving time that is actually never used, but instead allocates it for actual data transfer.on AP: distance to farthest client in kmon station: no effect.'
            nv2_downlink_ratio: (Number) Specifies the Nv2 downlink ratio. Uplink ratio is automatically calculated from the downlink-ratio value. When using dynamic-downlink mode the downlink-ratio is also used when link get fully saturated. Minimum value is 20 and maximum 80.
            nv2_mode: (String) Specifies to use dynamic or fixed downlink/uplink ratio.
            nv2_noise_floor_offset: (String)
            nv2_preshared_key: (String, Sensitive) Specifies preshared key to be used.
            nv2_qos: (String) Sets the packet priority mechanism, firstly data from high priority queue is sent, then lower queue priority data until 0 queue priority is reached. When link is full with high priority queue data, lower priority data is not sent. Use it very carefully, setting works on APframe-priority - manual setting that can be tuned with Mangle rules.default - default setting where small packets receive priority for best latency.
            nv2_queue_count: (Number) Specifies how many priority queues are used in Nv2 network.
            nv2_security: (String) Specifies Nv2 security mode.
            nv2_sync_secret: (String, Sensitive) Specifies secret key for use in the Nv2 synchronization. Secret should match on Master and Slave devices in order to establish the synced state.
            on_fail_retry_time: (String) After third sending failure on the lowest data rate, wait for specified time interval before retrying.
            periodic_calibration: (String) Setting default enables periodic calibration if  info  default-periodic-calibration property is enabled. Value of that property depends on the type of wireless card. This property is only effective for cards based on Atheros chipset.
            periodic_calibration_interval: (Number) This property is only effective for cards based on Atheros chipset.
            preamble_mode: '(String) Short preamble mode is an option of 802.11b standard that reduces per-frame overhead.On AP:'
            prism_cardtype: (String) Specify type of the installed Prism wireless card.
            proprietary_extensions: (String) RouterOS includes proprietary information in an information element of management frames. This parameter controls how this information is included. `pre-2.9.25` - This is older method. It can interoperate with newer versions of RouterOS. This method is incompatible with some clients, for example, Centrino based ones. `post-2.9.25` - This uses standardized way of including vendor specific information, that is compatible with newer wireless clients.
            radio_name: (String) Descriptive name of the device, that is shown in registration table entries on the remote devices. This is a proprietary extension.
            rate_selection: (String) Starting from v5.9 default value is advanced since legacy mode was inefficient.
            rate_set: '(String) Two options are available: `default` - default basic and supported rate sets are used. Values from basic-rates and supported-rates parameters have no effect. `configured` - use values from basic-rates, supported-rates, basic-mcs, mcs.'
            running: (Boolean)
            rx_chains: (Set of Number) Which antennas to use for receive. In current MikroTik routers, both RX and TX chain must be enabled, for the chain to be enabled.
            scan_list: '(String) The default value is all channels from selected band that are supported by card and allowed by the country and frequency-mode settings (this list can be seen in  info). For default scan list in 5ghz band channels are taken with 20MHz step, in 5ghz-turbo band - with 40MHz step, for all other bands - with 5MHz step. If scan-list is specified manually, then all matching channels are taken. (Example: scan-list=default,5200-5245,2412-2427 - This will use the default value of scan list for current band, and add to it supported frequencies from 5200-5245 or 2412-2427 range.) Since RouterOS v6.0 with Winbox or Webfig, for inputting of multiple frequencies, add each frequency or range of frequencies into separate multiple scan-lists. Using a comma to separate frequencies is no longer supported in Winbox/Webfig since v6.0.Since RouterOS v6.35 (wireless-rep) scan-list support step feature where it is possible to manually specify the scan step. Example: scan-list=5500-5600:20 will generate such scan-list values 5500,5520,5540,5560,5580,5600.'
            secondary_frequency: (String) Specifies secondary channel, required to enable 80+80MHz transmission. To disable 80+80MHz functionality, set secondary-frequency to `` or unset the value via CLI/GUI.
            security_profile: (String) Name of profile from  security-profiles.
            skip_dfs_channels: (String) These values are used to skip all DFS channels or specifically skip DFS CAC channels in range 5600-5650MHz which detection could go up to 10min.
            ssid: (String) SSID (service set identifier) is a name that identifies wireless network.
            station_bridge_clone_mac: (String) This property has effect only in the station-pseudobridge-clone mode.Use this MAC address when connection to AP. If this value is 00:00:00:00:00:00, station will initially use MAC address of the wireless interface.As soon as packet with MAC address of another device needs to be transmitted, station will reconnect to AP using that address.
            station_roaming: (String) Station Roaming feature is available only for 802.11 wireless protocol and only for station modes.
            supported_rates_ag: (String) List of supported rates, used for all bands except 2ghz-b.
            supported_rates_b: (String) List of supported rates, used for `2ghz-b, `2ghz-b/g` and `2ghz-b/g/n` bands. Two devices will communicate only using rates that are supported by both devices. This property has effect only when value of rate-set is configured.
            tdma_period_size: (Number) Specifies TDMA period in milliseconds. It could help on the longer distance links, it could slightly increase bandwidth, while latency is increased too.
            tx_chains: (Set of Number) Which antennas to use for transmitting. In current MikroTik routers, both RX and TX chain must be enabled, for the chain to be enabled.
            tx_power: (Number) For 802.11ac wireless interface it's total power but for 802.11a/b/g/n it's power per chain.
            tx_power_mode: (String) Sets up tx-power mode for wireless card `default` - use values stored in the card `all-rates-fixed` - use same transmit power for all data rates. Can damage the card if transmit power is set above rated value of the card for used rate. `manual-table` - define transmit power for each rate separately. Can damage the card if transmit power is set above rated value of the card for used rate. `card-rates` - use transmit power calculated for each rate based on value of tx-power parameter. Legacy mode only compatible with currently discontinued products.
            update_stats_interval: (String) How often to request update of signals strength and ccq values from clients. Access to registration-table  also triggers update of these values.This is proprietary extension.
            vht_basic_mcs: (String) Modulation and Coding Schemes that every connecting client must support. Refer to 802.11ac for MCS specification. You can set MCS interval for each of Spatial Stream
            vht_supported_mcs: (String) Modulation and Coding Schemes that this device advertises as supported. Refer to 802.11ac for MCS specification. You can set MCS interval for each of Spatial Stream
            vlan_id: (Number) VLAN ID to use if doing VLAN tagging.
            vlan_mode: (String) VLAN tagging mode specifies if traffic coming from client should get tagged (and untagged when going to client).
            wds_cost_range: (String) Bridge port cost of WDS links are automatically adjusted, depending on measured link throughput. Port cost is recalculated and adjusted every 5 seconds if it has changed by more than 10%, or if more than 20 seconds have passed since the last adjustment.Setting this property to 0 disables automatic cost adjustment.Automatic adjustment does not work for WDS links that are manually configured as a bridge port.
            wds_default_bridge: (String) When WDS link is established and status of the wds interface becomes running, it will be added as a bridge port to the bridge interface specified by this property. When WDS link is lost, wds interface is removed from the bridge. If wds interface is already included in a bridge setup when WDS link becomes active, it will not be added to bridge specified by , and will (needs editing).
            wds_default_cost: (Number) Initial bridge port cost of the WDS links.
            wds_ignore_ssid: (Boolean) By default, WDS link between two APs can be created only when they work on the same frequency and have the same SSID value. If this property is set to yes, then SSID of the remote AP will not be checked. This property has no effect on connections from clients in station-wds mode. It also does not work if wds-mode is static-mesh or dynamic-mesh.
            wds_mode: (String) Controls how WDS links with other devices (APs and clients in station-wds mode) are established.
            wireless_protocol: (String) Specifies protocol used on wireless interface;
            wmm_support: (String) Specifies whether to enable  WMM.  Only applies to bands `B` and `G`. Other bands will have it enabled regardless of this setting.
            wps_mode: (String) WPS Server allows to connect wireless clients that support WPS to AP protected with the Pre-Shared Key without specifying that key in the clients configuration.
        importStatements:
            - terraform import routeros_interface_wireless.test *3
            - terraform import routeros_interface_wireless.test "name=xxx"
    routeros_interface_wireless_access_list:
        subCategory: ""
        name: routeros_interface_wireless_access_list
        title: routeros_interface_wireless_access_list (Resource)
        argumentDocs:
            allow_signal_out_of_range: (String) Option which permits client's signal to be out of the range always or for some time interval.
            ap_tx_limit: (Number) Limit rate of data transmission to this client. Value 0 means no limit. Value is in bits per second.
            authentication: (Boolean) No - Client association will always fail.yes - Use authentication procedure that is specified in the security-profile of the interface.
            client_tx_limit: (Number) Ask client to limit rate of data transmission. Value 0 means no limit.This is a proprietary extension that is supported by RouterOS clients.Value is in bits per second.
            comment: (String)
            disabled: (Boolean)
            forwarding: (Boolean) * false - Client cannot send frames to other station that are connected to same access point.
            id: (String) The ID of this resource.
            interface: (String) Rules with interface=any are used for any wireless interface and the `interface = all` defines interface-list `all` name. To make rule that applies only to one wireless interface, specify that interface as a value of this property.
            mac_address: (String) Rule matches client with the specified MAC address. Value 00:00:00:00:00:00 matches always.
            management_protection_key: (String) Management protection shared secret.
            private_algo: (String) Only for `WEP` modes.
            private_key: (String) Only for `WEP` modes (HEX).
            private_pre_shared_key: (String) Used in `WPA PSK` mode.
            signal_range: (String) Rule matches if signal strength of the station is within the range.If signal strength of the station will go out of the range that is specified in the rule, access point will disconnect that station.
            time: '(String) Rule will match only during specified time.Station will be disconnected after specified time ends. Both start and end time is expressed as time since midnight, 00:00. Rule will match only during specified days of the week. Ex: "3h3m-5h,mon,tue,wed,thu,fri"'
            vlan_id: (Number) VLAN ID to use if doing VLAN tagging.
            vlan_mode: (String) VLAN tagging mode specifies if traffic coming from client should get tagged (and untagged when going to client).
        importStatements:
            - terraform import routeros_interface_wireless_access_list.test *3
            - terraform import routeros_interface_wireless_access_list.test "name=xxx"
    routeros_interface_wireless_cap:
        subCategory: ""
        name: routeros_interface_wireless_cap
        title: routeros_interface_wireless_cap (Resource)
        argumentDocs:
            bridge: (String) Bridge interface to add the interface as a bridge port.
            caps_man_addresses: (List of String) List of Manager IP addresses that CAP will attempt to contact during discovery.
            caps_man_certificate_common_names: (List of String) List of manager certificate common names that CAP will connect to.
            caps_man_names: (List of String) An ordered list of CAPs Manager names that the CAP will connect to.
            certificate: (String) Certificate to use for authentication.
            discovery_interfaces: (Set of String) List of interfaces over which CAP should attempt to discover CAPs Manager.
            enabled: (Boolean) Disable or enable the CAP functionality.
            id: (String) The ID of this resource.
            interfaces: (Set of String) List of interfaces managed by CAPs Manager.
            lock_to_caps_man: (Boolean) Lock CAP to the first CAPsMAN it connects to.
            locked_caps_man_common_name: (String) Common name of the CAPsMAN that the CAP is locked to.
            requested_certificate: (String) Requested certificate.
            static_virtual: (Boolean) An option that creates static virtual interfaces.
        importStatements:
            - terraform import routeros_interface_wireless_cap.settings .
            - terraform import routeros_interface_wireless_cap.settings "name=xxx"
    routeros_interface_wireless_connect_list:
        subCategory: ""
        name: routeros_interface_wireless_connect_list
        title: routeros_interface_wireless_connect_list (Resource)
        argumentDocs:
            allow_signal_out_of_range: (String)
            area_prefix: (String) Rule matches if area value of AP (a proprietary extension) begins with specified value.area value is a proprietary extension.
            comment: (String)
            connect: '(Boolean) Available options: yes - Connect to access point that matches this rule. no - Do not connect to any access point that matches this rule.'
            disabled: (Boolean)
            id: (String) The ID of this resource.
            interface: (String) Name of the interface.
            interworking: (String)
            iw_asra: (String) Additional Steps Required for Access. Set to yes, if a user should take additional steps to access the internet, like the walled garden.
            iw_authentication_types: '(String) This property is only effective when `asra` is set to `yes`. Value of `url` is optional and not needed if `dns-redirection` or `online-enrollment` is selected. To set the value of `url` to empty string use double quotes. For example: `authentication-types=online-enrollment:""`'
            iw_connection_capabilities: (String) This option allows to provide information about the allowed IP protocols and ports. This information can be provided in ANQP response. The first number represents the IP protocol number, the second number represents a port number.
            iw_esr: (String) Emergency services reachable (ESR). Set to yes in order to indicate that emergency services are reachable through the access point.
            iw_hessid: (String) Homogenous extended service set identifier (HESSID). Devices that provide access to same external networks are in one homogenous extended service set. This service set can be identified by HESSID that is the same on all access points in this set. 6-byte value of HESSID is represented as MAC address. It should be globally unique, therefore it is advised to use one of the MAC address of access point in the service set.
            iw_hotspot20: (String) Indicate Hotspot 2.0 capability of the Access Point.
            iw_hotspot20_dgaf: (String) Downstream Group-Addressed Forwarding (DGAF). Sets value of DGAF bit to indicate whether multicast and broadcast frames to clients are disabled or enabled.
            iw_internet: (String) Whether the internet is available through this connection or not. This information is included in the Interworking element.
            iw_ipv4_availability: (String) Information about what IPv4 address and access are available.
            iw_ipv6_availability: (String) Information about what IPv6 address and access are available.
            iw_network_type: (String) Information about network access type.
            iw_realms: (String) Information about supported realms and the corresponding EAP method. `realms=example.com:eap-tls,foo.ba:not-specified`
            iw_roaming_ois: '(String) Organization identifier (OI) usually are 24-bit is unique identifiers like organizationally unique identifier (OUI) or company identifier (CID). In some cases, OI is longer for example OUI-36.A subscription service provider (SSP) can be specified by its OI. roaming-ois property can contain zero or more SSPs OIs whose networks are accessible via this AP. Length of OI should be specified before OI itself. For example, to set E4-8D-8C and 6C-3B-6B: `roaming-ois=03E48D8C036C3B6B`'
            iw_uesa: (String) Unauthenticated emergency service accessible (UESA).
            iw_venue: '(String) Specify the venue in which the Access Point is located. Choose the value from available ones. Some examples:'
            mac_address: (String) Rule matches only AP with the specified MAC address.
            security_profile: (String) Name of security profile that is used when connecting to matching access points, If value of this property is none, then security profile specified in the interface configuration will be used. In station mode, rule will match only access points that can support specified security profile. Value none will match access point that supports security profile that is specified in the interface configuration. In access point mode value of this property will not be used to match remote devices.
            signal_range: (String) Rule matches if signal strength of the access point is within the range. If station establishes connection to access point that is matched by this rule, it will disconnect from that access point when signal strength goes out of the specified range.
            ssid: (String) Rule matches access points that have this SSID. Empty value matches any SSID. This property has effect only when station mode interface ssid is empty, or when access point mode interface has wds-ignore-ssid=yes.
            three_gpp: (String)
            wireless_protocol: (String)
        importStatements:
            - terraform import routeros_interface_wireless_connect_list.test *3
            - terraform import routeros_interface_wireless_connect_list.test "name=xxx"
    routeros_interface_wireless_security_profiles:
        subCategory: ""
        name: routeros_interface_wireless_security_profiles
        title: routeros_interface_wireless_security_profiles (Resource)
        argumentDocs:
            authentication_types: (Set of String) Set of supported authentication types, multiple values can be selected. Access Point will advertise supported authentication types, and client will connect to Access Point only if it supports any of the advertised authentication types.
            comment: (String)
            default: (Boolean) It's the default item.
            disable_pmkid: (Boolean) Whether to include `PMKID` into the `EAPOL` frame sent out by the Access Point. Disabling PMKID can cause compatibility issues with devices that use the PMKID to connect to an Access Point. `yes` - removes PMKID from EAPOL frames (improves security, reduces compatibility). `no` - includes PMKID into EAPOL frames (reduces security, improves compatibility).This property only has effect on Access Points.
            eap_methods: (String) Allowed types of authentication methods, multiple values can be selected. This property only has effect on Access Points. `eap-tls` - Use built-in EAP TLS authentication. Both client and server certificates are supported. See description of tls-mode and tls-certificate properties. `eap-ttls-mschapv2` - Use EAP-TTLS with MS-CHAPv2 authentication. `passthrough` - Access Point will relay authentication process to the RADIUS server. `peap` - Use Protected EAP authentication.
            group_ciphers: (String) Access Point advertises one of these ciphers, multiple values can be selected. Access Point uses it to encrypt all broadcast and multicast frames. Client attempts connection only to Access Points that use one of the specified group ciphers. `tkip` - Temporal Key Integrity Protocol - encryption protocol, compatible with legacy WEP equipment, but enhanced to correct some of the WEP flaws. `aes-ccm` - more secure WPA encryption protocol, based on the reliable AES (Advanced Encryption Standard). Networks free of WEP legacy should use only this cipher.
            group_key_update: (String) Controls how often Access Point updates the group key. This key is used to encrypt all broadcast and multicast frames. property only has effect for Access Points.
            id: (String) The ID of this resource.
            interim_update: (String) When RADIUS accounting is used, Access Point periodically sends accounting information updates to the RADIUS server. This property specifies default update interval that can be overridden by the RADIUS server using Acct-Interim-Interval attribute.
            management_protection: '(String) Management frame protection. Used for: Deauthentication attack prevention, MAC address cloning issue. Possible values are: `disabled` - management protection is disabled (default), `allowed` - use management protection if supported by remote party (for AP - allow both, non-management protection and management protection clients, for client - connect both to APs with and without management protection), `required` - establish association only with remote devices that support management protection (for AP - accept only clients that support management protection, for client - connect only to APs that support management protection).'
            management_protection_key: (String, Sensitive) Management protection shared secret. When interface is in AP mode, default management protection key (configured in security-profile) can be overridden by key specified in access-list or RADIUS attribute.
            mode: '(String) Encryption mode for the security profile. `none` - Encryption is not used. Encrypted frames are not accepted. `static-keys-required` - WEP mode. Do not accept and do not send unencrypted frames. Station in static-keys-required mode will not connect to an Access Point in static-keys-optional mode. `static-keys-optional` - WEP mode. Support encryption and decryption, but allow also to receive and send unencrypted frames. Device will send unencrypted frames if encryption algorithm is specified as none. Station in static-keys-optional mode will not connect to an Access Point in `static-keys-required` mode. See also: static-sta-private-algo, static-transmit-key. `dynamic-keys` - WPA mode.'
            mschapv2_password: (String) Password to use for authentication when `eap-ttls-mschapv2` or `peap` authentication method is being used. This property only has effect on Stations.
            mschapv2_username: (String) Username to use for authentication when `eap-ttls-mschapv2` or `peap` authentication method is being used. This property only has effect on Stations.
            name: (String) Name of the security profile.
            radius_called_format: (String) mac | mac:ssid | ssid
            radius_eap_accounting: (Boolean)
            radius_mac_accounting: (Boolean)
            radius_mac_authentication: (Boolean) This property affects the way how Access Point processes clients that are not found in the Access List.no - allow or reject client authentication based on the value of default-authentication property of the Wireless interface.yes - Query RADIUS server using MAC address of client as user name. With this setting the value of default-authentication has no effect.
            radius_mac_caching: (String) If this value is set to time interval, the Access Point will cache RADIUS MAC authentication responses for specified time, and will not contact RADIUS server if matching cache entry already exists. Value disabled will disable cache, Access Point will always contact RADIUS server.
            radius_mac_format: (String) Controls how MAC address of the client is encoded by Access Point in the User-Name attribute of the MAC authentication and MAC accounting RADIUS requests.
            radius_mac_mode: (String) By default Access Point uses an empty password, when sending Access-Request during MAC authentication. When this property is set to `as-username-and-password`, Access Point will use the same value for User-Password attribute as for the User-Name attribute.
            static_algo_0: (String) Encryption algorithm to use with the corresponding key.
            static_algo_1: (String) Encryption algorithm to use with the corresponding key.
            static_algo_2: (String) Encryption algorithm to use with the corresponding key.
            static_algo_3: (String) Encryption algorithm to use with the corresponding key.
            static_key_0: (String, Sensitive) Hexadecimal representation of the key. Length of key must be appropriate for selected algorithm. See the Statically configured WEP keys section.
            static_key_1: (String, Sensitive) Hexadecimal representation of the key. Length of key must be appropriate for selected algorithm. See the Statically configured WEP keys section.
            static_key_2: (String, Sensitive) Hexadecimal representation of the key. Length of key must be appropriate for selected algorithm. See the Statically configured WEP keys section.
            static_key_3: (String, Sensitive) Hexadecimal representation of the key. Length of key must be appropriate for selected algorithm. See the Statically configured WEP keys section.
            static_sta_private_algo: (String) Encryption algorithm to use with station private key. Value none disables use of the private key. This property is only used on Stations. Access Point has to get corresponding value either from private-algo property, or from Mikrotik-Wireless-Enc-Algo attribute. Station private key replaces key 0 for unicast frames. Station will not use private key to decrypt broadcast frames.
            static_sta_private_key: (String, Sensitive) Length of key must be appropriate for selected algorithm, see the Statically configured WEP keys section. This property is used only on Stations. Access Point uses corresponding key either from private-key property, or from Mikrotik-Wireless-Enc-Key attribute.
            static_transmit_key: (String) Access Point will use the specified key to encrypt frames for clients that do not use private key. Access Point will also use this key to encrypt broadcast and multicast frames. Client will use the specified key to encrypt frames if static-sta-private-algo is set to none. If corresponding static-algo-N property has value set to none, then frame will be sent unencrypted (when mode is set to static-keys-optional) or will not be sent at all (when mode is set to static-keys-required).
            supplicant_identity: (String, Sensitive) EAP identity that is sent by client at the beginning of EAP authentication. This value is used as a value for User-Name attribute in RADIUS messages sent by RADIUS EAP accounting and RADIUS EAP pass-through authentication.
            tls_certificate: (String) Access Point always needs a certificate when configured when tls-mode is set to verify-certificate, or is set to dont-verify-certificate. Client needs a certificate only if Access Point is configured with tls-mode set to verify-certificate. In this case client needs a valid certificate that is signed by a CA known to the Access Point. This property only has effect when tls-mode is not set to no-certificates and eap-methods contains eap-tls.
            tls_mode: (String) This property has effect only when eap-methods contains eap-tls. `verify-certificate` - Require remote device to have valid certificate. Check that it is signed by known certificate authority. No additional identity verification is done. Certificate may include information about time period during which it is valid. If router has incorrect time and date, it may reject valid certificate because router's clock is outside that period. See also the Certificates configuration. `dont-verify-certificate` - Do not check certificate of the remote device. Access Point will not require client to provide certificate. `no-certificates` - Do not use certificates. TLS session is established using 2048 bit anonymous Diffie-Hellman key exchange. `verify-certificate-with-crl` - Same as verify-certificate but also checks if the certificate is valid by checking the Certificate Revocation List.
            unicast_ciphers: (String) Access Point advertises that it supports specified ciphers, multiple values can be selected. Client attempts connection only to Access Points that supports at least one of the specified ciphers. One of the ciphers will be used to encrypt unicast frames that are sent between Access Point and Station.
            wpa_pre_shared_key: (String, Sensitive) `WPA` pre-shared key mode requires all devices in a BSS to have common secret key. Value of this key can be an arbitrary text. Commonly referred to as the network password for WPA mode. property only has effect when wpa-psk is added to authentication-types.
            wpa2_pre_shared_key: (String, Sensitive) `WPA2` pre-shared key mode requires all devices in a BSS to have common secret key. Value of this key can be an arbitrary text. Commonly referred to as the network password for WPA2 mode. property only has effect when wpa2-psk is added to authentication-types.
        importStatements:
            - terraform import routeros_interface_wireless_security_profiles.test *3
            - terraform import routeros_interface_wireless_security_profiles.test "name=xxx"
    routeros_ip_address:
        subCategory: ""
        name: routeros_ip_address
        title: routeros_ip_address (Resource)
        argumentDocs:
            actual_interface: (String) Name of the actual interface the logical one is bound to.
            address: (String) IP address.
            comment: (String)
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            id: (String) The ID of this resource.
            interface: (String) Name of the interface.
            invalid: (Boolean)
            network: (String) IP address for the network. For point-to-point links it should be the address of the remote end. Starting from v5RC6 this parameter is configurable only for addresses with /32 netmask (point to point links)
            slave: (Boolean) Whether address belongs to an interface which is a slave port to some other master interface
            vrf: (String) The VRF table this resource operates on.
        importStatements:
            - terraform import routeros_ip_address.address "*0"
            - terraform import routeros_ip_address.address "name=xxx"
    routeros_ip_cloud:
        subCategory: ""
        name: routeros_ip_cloud
        title: routeros_ip_cloud (Resource)
        argumentDocs:
            back_to_home_vpn: (String) Enables or revokes and disables the Back to Home service. ddns-enabled has to be set to yes, for BTH to function.
            ddns_enabled: (String) If set to yes, then the device will send an encrypted message to the MikroTik's Cloud server. The server will then decrypt the message and verify that the sender is an authentic MikroTik device. If all is OK, then the MikroTik's Cloud server will create a DDNS record for this device and send a response to the device. Every minute the IP/Cloud service on the router will check if WAN IP address matches the one sent to MikroTik's Cloud server and will send encrypted update to cloud server if IP address changes.
            ddns_update_interval: (String) If set DDNS will attempt to connect IP Cloud servers at the set interval. If set to none it will continue to internally check IP address update and connect to IP Cloud servers as needed. Useful if IP address used is not on the router itself and thus, cannot be checked as a value internal to the router.
            dns_name: (String) Shows DNS name assigned to the rdevice. Name consists of 12 character serial number appended by .sn.mynetname.net. This field is visible only after at least one ddns-request is successfully completed.
            id: (String) The ID of this resource.
            public_address: (String) Shows device's IPv4 address that was sent to cloud server. This field is visible only after at least one IP Cloud request was successfully completed.
            public_address_ipv6: (String) Shows device's IPv6 address that was sent to cloud server. This field is visible only after at least one IP Cloud request was successfully completed.
            status: '(String) Contains text string that describes current dns-service state. The messages are self explanatory  updating... updated Error: no Internet connection Error: request timed out Error: REJECTED. Contact MikroTik support Error: internal error - should not happen. One possible cause is if router runs out of memory.'
            update_time: (String) If set to yes then router clock will be set to time, provided by cloud server IF there is no NTP or SNTP client enabled. If set to no, then IP/Cloud service will never update the device's clock. If update-time is set to yes, Clock will be updated even when ddns-enabled is set to no.
            vpn_prefer_relay_code: (String) You can enter relay code that will be preferred for BTH connection, if not set, relay with smallest RTT will be chosen.
            warning: '(String) Shows a warning message if IP address sent by the device differs from the IP address in UDP packet header as visible by the MikroTik''s Cloud server. Typically this happens if the device is behind NAT. Example: ''DDNS server received request from IP 123.123.123.123 but your local IP was 192.168.88.23; DDNS service might not work'''
        importStatements:
            - terraform import routeros_ip_cloud.test .
    routeros_ip_cloud_advanced:
        subCategory: ""
        name: routeros_ip_cloud_advanced
        title: routeros_ip_cloud_advanced (Resource)
        argumentDocs:
            id: (String) The ID of this resource.
            use_local_address: (Boolean) An option whether to assign an internal router address to the dynamic DNS name.
        importStatements:
            - terraform import routeros_ip_cloud_advanced.settings .
    routeros_ip_dhcp_client:
        subCategory: ""
        name: routeros_ip_dhcp_client
        title: routeros_ip_dhcp_client (Resource)
        argumentDocs:
            add_default_route: (String) Whether to install default route in routing table received from DHCP server.
            address: (String) IP address and netmask, which is assigned to DHCP Client from the Server.
            allow_reconfigure: (Boolean)
            check_gateway: (String) Method on how to check gateway reachability.
            comment: (String)
            default_route_distance: (Number) Distance of default route. Applicable if add-default-route is set to yes.
            default_route_tables: (Set of String) Default route tables.
            dhcp_options: (String) Options that are sent to the DHCP server.
            dhcp_server: (String) The IP address of the DHCP server.
            disabled: (Boolean)
            dscp: (Number) Sets the DSCP (Differentiated Services Code Point) value for outgoing DHCP client packets. This value is part of the IP header and is used to indicate the desired Quality of Service (QoS) level for network traffic.
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            expires_after: (String) A time when the lease expires (specified by the DHCP server).
            gateway: (String) The IP address of the gateway which is assigned by DHCP server.
            id: (String) The ID of this resource.
            interface: (String) Name of the interface.
            invalid: (Boolean)
            primary_dns: (String) The IP address of the first DNS resolver, that was assigned by the DHCP server.
            primary_ntp: (String) The IP address of the primary NTP server, assigned by the DHCP server.
            script: (String) A script.
            secondary_dns: (String) The IP address of the second DNS resolver, assigned by the DHCP server.
            secondary_ntp: (String) The IP address of the secondary NTP server, assigned by the DHCP server.
            status: (String)
            use_broadcast: (String) Whether to set broadcast bit in DHCPDISCOVER and DHCPREQUEST messages.
            use_peer_dns: (Boolean) Whether to accept the DNS settings advertised by DHCP Server (will override the settings put in the /ip dns submenu).
            use_peer_ntp: (Boolean) Whether to accept the NTP settings advertised by DHCP Server (will override the settings put in the /system ntp client submenu).
            use_reconfigure: (Boolean) Allow the server to send Reconfigure messages to clients, prompting them to renew or update their configuration without waiting for their lease to expire.
            vlan_priority: (Number) If the DHCP client is running on a VLAN interface (`/interface/vlan`), you can specify the Priority Code Point (PCP) value. PCP is a 3-bit field in the VLAN header used to mark the priority of packets within a VLAN, allowing traffic to be prioritized accordingly. This setting applies only to VLAN interfaces and affects the priority of outgoing DHCP client packets.
        importStatements:
            - terraform import routeros_ip_dhcp_client.client "*0"
            - terraform import routeros_ip_dhcp_client.client "name=xxx"
    routeros_ip_dhcp_client_option:
        subCategory: ""
        name: routeros_ip_dhcp_client_option
        title: routeros_ip_dhcp_client_option (Resource)
        argumentDocs:
            code: (Number) The dhcp-client option code.
            id: (String) The ID of this resource.
            name: (String) The name that will be used in dhcp-client.
            raw_value: (String) raw_value is computed from value.
            value: (String) The dhcp-client option
        importStatements:
            - terraform import routeros_ip_dhcp_client_option.option "*0"
            - terraform import routeros_ip_dhcp_client_option.option "name=xxx"
    routeros_ip_dhcp_relay:
        subCategory: ""
        name: routeros_ip_dhcp_relay
        title: routeros_ip_dhcp_relay (Resource)
        argumentDocs:
            add_relay_info: (Boolean) Adds DHCP relay agent information if enabled according to RFC 3046. Agent Circuit ID Sub-option contains mac address of an interface, Agent Remote ID Sub-option contains MAC address of the client from which request was received.
            delay_threshold: (String) If secs field in DHCP packet is smaller than delay-threshold, then this packet is ignored.
            dhcp_server: (String) List of DHCP servers' IP addresses which should the DHCP requests be forwarded to.
            dhcp_server_vrf: (String) The VRF table this resource operates on.
            disabled: (Boolean)
            id: (String) The ID of this resource.
            interface: (String) Interface name the DHCP relay will be working on.
            invalid: (Boolean)
            local_address: (String) The unique IP address of this DHCP relay needed for DHCP server to distinguish relays. If set to 0.0.0.0 - the IP address will be chosen automatically
            name: (String) Descriptive name for the relay.
            relay_info_remote_id: '(String) Specified string will be used to construct Option 82 instead of client''s MAC address. Option 82 consist of: interface from which packets was received + client mac address or relay-info-remote-id'
        importStatements:
            - terraform import routeros_ip_dhcp_relay.relay "*0"
            - terraform import routeros_ip_dhcp_relay.relay "name=xxx"
    routeros_ip_dhcp_server:
        subCategory: ""
        name: routeros_ip_dhcp_server
        title: routeros_ip_dhcp_server (Resource)
        argumentDocs:
            add_arp: (Boolean) Whether to add dynamic ARP entry.
            address_lists: (Set of String) Address list to which address will be added if lease is bound.
            address_pool: (String) IP pool, from which to take IP addresses for the clients. If set to static-only, then only the clients that have a static lease (added in lease submenu) will be allowed.
            allow_dual_stack_queue: (Boolean) Creates a single simple queue entry for both IPv4 and IPv6 addresses, uses the MAC address and DUID for identification. Requires IPv6 DHCP Server to have this option enabled as well to work properly.
            always_broadcast: (Boolean) Always send replies as broadcasts even if destination IP is known.
            authoritative: (String) Option changes the way how a server responds to DHCP requests.
            bootp_lease_time: '(String) Accepts two predefined options or time value: * forever - lease never expires * lease-time - use time from lease-time parameter'
            bootp_support: (String) Support for BOOTP clients.
            client_mac_limit: (Number) Specifies whether to limit specific number of clients per single MAC address.
            comment: (String)
            conflict_detection: (Boolean) Allows to disable/enable conflict detection. If option is enabled, then whenever server tries to assign a lease it will send ICMP and ARP messages to detect whether such address in the network already exist. If any of above get reply address is considered already used. Conflict detection must be disabled when any kind of DHCP client limitation per port or per mac is used.
            delay_threshold: (String) If secs field in DHCP packet is smaller than delay-threshold, then this packet is ignored. If set to none - there is no threshold (all DHCP packets are processed).
            dhcp_option_set: (String) Use custom set of DHCP options defined in option sets menu.
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            dynamic_lease_identifiers: (String) Dynamic lease identifier
            id: (String) The ID of this resource.
            insert_queue_before: (String) Specify where to place dynamic simple queue entries for static DCHP leases with rate-limit parameter set.
            interface: (String) Name of the interface.
            invalid: (Boolean)
            lease_script: (String) A script that will be executed after a lease is assigned or de-assigned.
            lease_time: (String) The time that a client may use the assigned address. The client will try to renew this address after half of this time and will request a new address after the time limit expires.
            name: (String) Changing the name of this resource will force it to be recreated.
            parent_queue: (String)
            relay: (String) The IP address of the relay this DHCP server.
            src_address: (String) The address which the DHCP client must send requests to in order to renew an IP address lease.
            support_broadband_tr101: (Boolean) Support broadband TR101
            use_framed_as_classless: (Boolean) Forward RADIUS Framed-Route as a DHCP Classless-Static-Route to DHCP-client.
            use_radius: (String) Whether to use RADIUS server.
            use_reconfigure: (Boolean) Allow the server to send Reconfigure (forcerenew) messages to clients, prompting them to renew configuration without waiting for their lease to expire.
        importStatements:
            - terraform import routeros_ip_dhcp_server.server "*1"
    routeros_ip_dhcp_server_config:
        subCategory: ""
        name: routeros_ip_dhcp_server_config
        title: routeros_ip_dhcp_server_config (Resource)
        argumentDocs:
            accounting: (Boolean) An option that enables accounting for DHCP leases.
            id: (String) The ID of this resource.
            interim_update: (String) An option determining whether the DHCP server sends periodic updates to the accounting server during a lease.
            radius_password: (String) An option to set the password parameter for the RADIUS server. This option is available in RouterOS starting from version 7.0.
            store_leases_disk: (String) An option of how often the DHCP leases will be stored on disk.
        importStatements:
            - terraform import routeros_ip_dhcp_server_config.settings .
    routeros_ip_dhcp_server_lease:
        subCategory: ""
        description: Creates a DHCP lease on the mikrotik device.
        name: routeros_ip_dhcp_server_lease
        title: routeros_ip_dhcp_server_lease (Resource)
        argumentDocs:
            active_address: (String) The IP address of the machine currently holding the DHCP lease.
            active_client_id: (String) Actual client-id of the client.
            active_hostname: (String) The hostname of the machine currently holding the DHCP lease.
            active_mac_address: (String) The MAC address of of the machine currently holding the DHCP lease.
            active_server: (String) Actual dhcp server, which serves this client.
            address: (String) The IP address of the DHCP lease to be created.
            address_lists: (String) Address list to which address will be added if lease is bound.
            agent_circuit_id: (String) Circuit ID of DHCP relay agent. If each character should be valid ASCII text symbol or else this value is displayed as hex dump.
            agent_remote_id: (String) Remote ID, set by DHCP relay agent.
            allow_dual_stack_queue: (Boolean) Creates a single simple queue entry for both IPv4 and IPv6 addresses, uses the MAC address and DUID for identification.
            always_broadcast: (Boolean) Send all replies as broadcasts.
            block_access: (Boolean) Whether to block access for this DHCP client (true|false).
            blocked: (Boolean) Whether the lease is blocked.
            class_id: (String) Class ID of the client. This option is available in RouterOS starting from version 7.16.
            client_id: (String) If specified, must match DHCP 'client identifier' option of the request.
            comment: (String)
            dhcp_option: (String) Add additional DHCP options.
            dhcp_option_set: (String) Add additional set of DHCP options.
            disabled: (Boolean)
            dynamic: (Boolean) Whether the dhcp lease is static or dynamic. Dynamic leases are not guaranteed to continue to be assigned to that specific device.
            expires_after: (String) Time until lease expires.
            host_name: (String) The hostname of the device
            id: (String) The ID of this resource.
            insert_queue_before: (String) Specify where to place dynamic simple queue entries for static DCHP leases with rate-limit parameter set.
            last_seen: (String)
            lease_time: (String) Time that the client may use the address. If set to 0s lease will never expire.
            mac_address: (String) The MAC addreess of the DHCP lease to be created.
            radius: (String) Shows if this dynamic lease is authenticated by RADIUS or not.
            rate_limit: (String) Adds a dynamic simple queue to limit IP's bandwidth to a specified rate. Requires the lease to be static.
            server: (String) Server name which serves this client.
            src_mac_address: (String) Source MAC address.
            status: (String) Lease status.
            use_src_mac: (Boolean) When this option is set server uses source MAC address instead of received CHADDR to assign address.
        importStatements:
            - terraform import routeros_ip_dhcp_server_lease.dhcp_lease "*0"
            - terraform import routeros_ip_dhcp_server_lease.dhcp_lease "name=xxx"
    routeros_ip_dhcp_server_network:
        subCategory: ""
        name: routeros_ip_dhcp_server_network
        title: routeros_ip_dhcp_server_network (Resource)
        argumentDocs:
            address: (String) The network DHCP server(s) will lease addresses from.
            boot_file_name: (String) Boot filename.
            caps_manager: (List of String) A list of IP addresses for one or more CAPsMAN system managers. DHCP Option 138 (capwap) will be used.
            comment: (String)
            dhcp_option: (List of String) Add additional DHCP options from the option list.
            dhcp_option_set: (String) Add an additional set of DHCP options.
            dns_none: (Boolean) If set, then DHCP Server will not pass dynamic DNS servers configured on the router to the DHCP clients if no DNS Server in DNS-server is set.
            dns_server: (List of String) The DHCP client will use these as the default DNS servers. Two DNS servers can be specified to be used by the DHCP client as primary and secondary DNS servers.
            domain: (String) The DHCP client will use this as the 'DNS domain' setting for the network adapter.
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            gateway: (String) The default gateway to be used by DHCP Client.
            id: (String) The ID of this resource.
            netmask: (Number) The actual network mask is to be used by the DHCP client. If set to '0' - netmask from network address will be used.
            next_server: (String) The IP address of the next server to use in bootstrap.
            ntp_none: (Boolean) If set, then DHCP Server will not pass NTP servers configured on the router to the DHCP clients.
            ntp_server: (List of String) The DHCP client will use these as the default NTP servers. Two NTP servers can be specified to be used by the DHCP client as primary and secondary NTP servers
            wins_server: (List of String) The Windows DHCP client will use these as the default WINS servers. Two WINS servers can be specified to be used by the DHCP client as primary and secondary WINS servers
        importStatements:
            - terraform import routeros_ip_dhcp_server_network.dhcp_server_network "*0"
            - terraform import routeros_ip_dhcp_server_network.dhcp_server_network "name=xxx"
    routeros_ip_dhcp_server_option:
        subCategory: ""
        description: Creates a DHCP lease on the mikrotik device.
        name: routeros_ip_dhcp_server_option
        title: routeros_ip_dhcp_server_option (Resource)
        argumentDocs:
            code: (Number) The number of the DHCP option
            comment: (String)
            force: (Boolean) Force the DHCP option from the server-side even if the DHCP-client does not request such parameter.
            id: (String) The ID of this resource.
            name: (String) The name of the DHCP option
            raw_value: (String) The computed value of the option as an hex value
            value: (String) The value with formatting using Mikrotik settings https://wiki.mikrotik.com/wiki/Manual:IP/DHCP_Server#DHCP_Options
        importStatements:
            - terraform import routeros_ip_dhcp_server_option.tftp_option "*1"
            - terraform import routeros_ip_dhcp_server_option.tftp_option "name=xxx"
    routeros_ip_dhcp_server_option_matcher:
        subCategory: ""
        name: routeros_ip_dhcp_server_option_matcher
        title: routeros_ip_dhcp_server_option_matcher (Resource)
        argumentDocs:
            address_pool: (String) IP pool, from which to take IP addresses for the clients. If set to static-only, then only the clients that have a static lease (added in lease submenu) will be allowed.
            code: (Number) DHCP option code. All codes are available at http://www.iana.org/assignments/bootp-dhcp-parameters
            comment: (String)
            disabled: (Boolean)
            id: (String) The ID of this resource.
            matching_type: '(String) Matching method:'
            name: (String) Changing the name of this resource will force it to be recreated.
            option_set: (String) A custom set of DHCP options defined in the Option Sets menu.
            server: (String) Server name which serves option matcher.
            value: (String) A value that will be searched for in option.
        importStatements:
            - terraform import routeros_ip_dhcp_server_option_matcher.test "*1"
    routeros_ip_dhcp_server_option_set:
        subCategory: ""
        description: '#### This is an alias for backwards compatibility between plugin versions. Please see documentation for [routeros_ip_dhcp_server_option_sets](ip_dhcp_server_option_sets.md)'
        name: routeros_ip_dhcp_server_option_set
        title: routeros_ip_dhcp_server_option_set (Resource)
        argumentDocs: {}
        importStatements: []
    routeros_ip_dhcp_server_option_sets:
        subCategory: ""
        description: Creates a DHCP lease on the mikrotik device.
        name: routeros_ip_dhcp_server_option_sets
        title: routeros_ip_dhcp_server_option_sets (Resource)
        argumentDocs:
            comment: (String)
            id: (String) The ID of this resource.
            name: (String) The name of the DHCP option
            options: (String) The comma sepparated list of options
        importStatements:
            - terraform import routeros_ip_dhcp_server_option_sets.lan_option_set "*1"
    routeros_ip_dns:
        subCategory: ""
        description: A MikroTik router with DNS feature enabled can be set as a DNS server for any DNS-compliant client.
        name: routeros_ip_dns
        title: routeros_ip_dns (Resource)
        argumentDocs:
            address_list_extra_time: (String)
            allow_remote_requests: (Boolean) Specifies whether to allow network requests.
            cache_max_ttl: '(String) Maximum time-to-live for cache records. In other words, cache records will expire unconditionally after cache-max-ttl time. Shorter TTL received from DNS servers are respected. *Default: 1w*'
            cache_size: '(Number) Specifies the size of DNS cache in KiB (64..4294967295). *Default: 2048*'
            cache_used: (Number) Shows the currently used cache size in KiB.
            doh_max_concurrent_queries: (Number) Specifies how many DoH concurrent queries are allowed.
            doh_max_server_connections: (Number) Specifies how many concurrent connections to the DoH server are allowed.
            doh_timeout: (String) Specifies how long to wait for query response from the DoH server.
            dynamic_servers: (String) List of dynamically added DNS server from different services, for example, DHCP.
            id: (String) The ID of this resource.
            max_concurrent_queries: '(Number) Specifies how much concurrent queries are allowed. *Default: 100*'
            max_concurrent_tcp_sessions: '(Number) Specifies how much concurrent TCP sessions are allowed. *Default: 20*'
            max_udp_packet_size: '(Number) Maximum size of allowed UDP packet. *Default: 4096*'
            mdns_repeat_ifaces: (Set of String) An option to enable mDNS repeater on specified interfaces. This option is available in RouterOS starting from version 7.16.
            query_server_timeout: '(String) Specifies how long to wait for query response from one server. Time can be specified in milliseconds. *Default: 2s*'
            query_total_timeout: '(String) Specifies how long to wait for query response in total. Note that this setting must be configured taking into account query_server_timeout and number of used DNS server. Time can be specified in milliseconds. *Default: 10s*'
            servers: (List of String) List of DNS server IPv4/IPv6 addresses.
            use_doh_server: (String) DNS over HTTPS (DoH) server URL.
            verify_doh_cert: (Boolean) DoH certificate verification. [See docs](https://wiki.mikrotik.com/wiki/Manual:IP/DNS#DNS_over_HTTPS).
            vrf: (String) The VRF table this resource operates on.
        importStatements: []
    routeros_ip_dns_adlist:
        subCategory: ""
        name: routeros_ip_dns_adlist
        title: routeros_ip_dns_adlist (Resource)
        argumentDocs:
            disabled: (Boolean)
            file: (String) Used to specify a local file path from which to read adlist data.
            id: (String) The ID of this resource.
            ssl_verify: (Boolean) Specifies whether to validate the server's SSL certificate when connecting to an online resource. Will use the `/certificate` list to verify server validity.
            url: (String) Used to specify the URL of an adlist.
        importStatements:
            - terraform import routeros_ip_dns_adlist.test "*0"
            - terraform import routeros_ip_dns_adlist.test "name=xxx"
    routeros_ip_dns_forwarders:
        subCategory: ""
        name: routeros_ip_dns_forwarders
        title: routeros_ip_dns_forwarders (Resource)
        argumentDocs:
            comment: (String)
            disabled: (Boolean)
            dns_servers: (Set of String) An IP address or DNS name of a domain name server. Can contain multiple records.
            doh_servers: (Set of String) A URL of DoH server. Can contain multiple records.
            id: (String) The ID of this resource.
            name: (String) Forwarder name.
            verify_doh_cert: (Boolean) Specifies whether to validate the DoH server, when one is being used. Will use the `/certificate` list in order to verify server validity.
        importStatements:
            - terraform import routeros_ip_dns_forwarders.test *3
            - terraform import routeros_ip_dns_forwarders.test "name=xxx"
    routeros_ip_dns_record:
        subCategory: ""
        description: Creates a DNS record on the MikroTik device.
        name: routeros_ip_dns_record
        title: routeros_ip_dns_record (Resource)
        argumentDocs:
            address: (String) The A record to be returend from the DNS hostname.
            address_list: (String) Name of the Firewall address list to which address must be dynamically added when some request matches the entry.
            cname: (String) Alias name for a domain name.
            comment: (String)
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            forward_to: (String) The IP address of a domain name server to which a particular DNS request must be forwarded.
            id: (String) The ID of this resource.
            match_subdomain: (Boolean) Whether the record will match requests for subdomains.
            mx_exchange: (String) The domain name of the MX server.
            mx_preference: (Number) Preference of the particular MX record.
            name: (String) The name of the DNS hostname to be created.
            ns: (String) Name of the authoritative domain name server for the particular record.
            regexp: (String) DNS regexp. Regexp entries are case sensitive, but since DNS requests are not case sensitive, RouterOS converts DNS names to lowercase, you should write regex only with lowercase letters.
            srv_port: (Number) The TCP or UDP port on which the service is to be found.
            srv_priority: (Number) Priority of the particular SRV record.
            srv_target: (String) The canonical hostname of the machine providing the service ends in a dot.
            srv_weight: (String) Weight of the particular SRC record.
            text: (String) Textual information about the domain name.
            ttl: (String) The ttl of the DNS record.
            type: '(String) Type of the DNS record. Available values are: A, AAAA, CNAME, FWD, MX, NS, NXDOMAIN, SRV, TXT'
        importStatements:
            - terraform import routeros_ip_dns_record.name_record "*0"
            - terraform import routeros_ip_dns_record.name_record "name=xxx"
    routeros_ip_firewall_addr_list:
        subCategory: ""
        name: routeros_ip_firewall_addr_list
        title: routeros_ip_firewall_addr_list (Resource)
        argumentDocs:
            address: (String) A single IP address or range of IPs to add to address list or DNS name. You can input for example, '192.168.0.0-192.168.1.255' and it will auto modify the typed entry to 192.168.0.0/23 on saving.
            comment: (String)
            creation_time: (String) Rule creation time
            disabled: (Boolean)
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            id: (String) The ID of this resource.
            list: (String) Name for the address list of the added IP address.
            timeout: (String) Time after address will be removed from address list. If timeout is not specified,
        importStatements:
            - terraform import routeros_ip_firewall_addr_list.example_list "*0"
            - terraform import routeros_ip_firewall_addr_list.example_list "name=xxx"
    routeros_ip_firewall_connection_tracking:
        subCategory: ""
        name: routeros_ip_firewall_connection_tracking
        title: routeros_ip_firewall_connection_tracking (Resource)
        argumentDocs:
            active_ipv4: (Boolean) documentation is missing
            active_ipv6: (Boolean) documentation is missing
            enabled: (String) Allows to disable or enable connection tracking. Disabling connection tracking will cause several firewall features to stop working.
            generic_timeout: (String) Timeout for all other connection entries
            icmp_timeout: (String) ICMP connection timeout
            id: (String) The ID of this resource.
            liberal_tcp_tracking: (Boolean) Enables or disables liberal TCP connection tracking by toggling the kernel parameter nf_conntrack_tcp_be_liberal. When set to `yes`, the system mark only out of window RST segments as INVALID.
            loose_tcp_tracking: (String) Disable picking up already established connections
            max_entries: (String) Max amount of entries that the connection tracking table can hold. This value depends on the installed amount of RAM.
            tcp_close_timeout: (String) No documentation
            tcp_close_wait_timeout: (String) No documentation
            tcp_established_timeout: (String) Time when established TCP connection times out.
            tcp_fin_wait_timeout: (String) No documentation
            tcp_last_ack_timeout: (String) No documentation
            tcp_max_retrans_timeout: (String) No documentation
            tcp_syn_received_timeout: (String) TCP SYN timeout.
            tcp_syn_sent_timeout: (String) TCP SYN timeout.
            tcp_time_wait_timeout: (String) No documentation
            tcp_unacked_timeout: (String) No documentation
            udp_stream_timeout: (String) Specifies the timeout of UDP connections that has seen packets in both directions
            udp_timeout: (String) Specifies the timeout for UDP connections that have seen packets in one direction
        importStatements: []
    routeros_ip_firewall_filter:
        subCategory: ""
        name: routeros_ip_firewall_filter
        title: routeros_ip_firewall_filter (Resource)
        argumentDocs:
            action: (String) Action to take if a packet is matched by the rule
            address_list: (String) Name of the address list used in 'add-dst-to-address-list' and 'add-src-to-address-list' actions.
            address_list_timeout: (String) Time interval after which the address will be removed from the address list specified by address-list parameter. Used in conjunction with add-dst-to-address-list or add-src-to-address-list actions.
            chain: (String) Specifies to which chain rule will be added. If the input does not match the name of an already defined chain, a new chain will be created.
            comment: (String)
            connection_bytes: (String) Matches packets only if a given amount of bytes has been transfered through the particular connection.
            connection_limit: (String) Matches connections per address or address block after given value is reached. Should be used together with connection-state=new and/or with tcp-flags=syn because matcher is very resource intensive.
            connection_mark: (String) Matches packets marked via mangle facility with particular connection mark. If no-mark is set, rule will match any unmarked connection.
            connection_nat_state: (String) Can match connections that are srcnatted, dstnatted or both.
            connection_rate: (String) Connection Rate is a firewall matcher that allow to capture traffic based on present speed of the connection (0..4294967295).
            connection_state: (String) Interprets the connection tracking analysis data for a particular packet.
            connection_type: (String) Matches packets from related connections based on information from their connection tracking helpers.
            content: (String) Match packets that contain specified text.
            disabled: (Boolean)
            dscp: (Number) Matches DSCP IP header field.
            dst_address: (String) Matches packets which destination is equal to specified IP or falls into specified IP range.
            dst_address_list: (String) Matches destination address of a packet against user-defined address list.
            dst_address_type: (String) Matches destination address type.
            dst_limit: (String) Matches packets until a given rate is exceeded.
            dst_port: (String) List of destination port numbers or port number ranges.
            dynamic: (Boolean) Configuration item created by software, not by management interface. It is not exported, and cannot be directly modified.
            fragment: (Boolean) Matches fragmented packets. First (starting) fragment does not count. If connection tracking is enabled there will be no fragments as system automatically assembles every packet
            hotspot: (String) Matches packets received from HotSpot clients against various HotSpot matchers.
            hw_offload: (Boolean) Connection offloading for Fasttrack.
            icmp_options: '(String) Matches ICMP type: code fields.'
            id: (String) The ID of this resource.
            in_bridge_port: (String) Actual interface the packet has entered the router if the incoming interface is a bridge. Works only if use-ip-firewall is enabled in bridge settings.
            in_bridge_port_list: (String) Set of interfaces defined in interface list. Works the same as in-bridge-port.
            in_interface: (String) Interface the packet has entered the router.
            in_interface_list: (String) Set of interfaces defined in interface list. Works the same as in-interface.
            ingress_priority: (Number) Matches the priority of an ingress packet. Priority may be derived from VLAN, WMM, DSCP, or MPLS EXP bit.
            invalid: (Boolean)
            ipsec_policy: '(String) Matches the policy used by IPsec. Value is written in the following format: direction, policy.'
            ipv4_options: (String) Matches IPv4 header options.
            jump_target: (String) Name of the target chain to jump to. Applicable only if action=jump.
            layer7_protocol: (String) Layer7 filter name.
            limit: '(String) Matches packets up to a limited rate (packet rate or bit rate). A rule using this matcher will match until this limit is reached. Parameters are written in the following format: rate[/time],burst:mode.'
            log: (Boolean) Add a message to the system log.
            log_prefix: (String) Adds specified text at the beginning of every log message. Applicable if action=log or log=yes configured.
            nth: '(String) Matches every nth packet: nth=2,1 rule will match every first packet of 2, hence, 50% of all the traffic that is matched by the rule'
            out_bridge_port: (String) Actual interface the packet is leaving the router if the outgoing interface is a bridge. Works only if use-ip-firewall is enabled in bridge settings.
            out_bridge_port_list: (String) Set of interfaces defined in interface list. Works the same as out-bridge-port.
            out_interface: (String) Interface the packet is leaving the router.
            out_interface_list: (String) Set of interfaces defined in interface list. Works the same as out-interface.
            packet_mark: (String) Matches packets marked via mangle facility with particular packet mark. If no-mark is set, the rule will match any unmarked packet.
            packet_size: (String) Matches packets of specified size or size range in bytes.
            per_connection_classifier: (String) PCC matcher allows dividing traffic into equal streams with the ability to keep packets with a specific set of options in one particular stream.
            place_before: (String) Before which position the rule will be inserted.
            port: (String) Matches if any (source or destination) port matches the specified list of ports or port ranges. Applicable only if protocol is TCP or UDP
            priority: (Number) Matches the packet's priority after a new priority has been set. Priority may be derived from VLAN, WMM, DSCP, MPLS EXP bit, or from the priority that has been set using the set-priority action.
            protocol: (String) Matches particular IP protocol specified by protocol name or number.
            psd: (String) Attempts to detect TCP and UDP scans. Parameters are in the following format WeightThreshold, DelayThreshold, LowPortWeight, HighPortWeight.
            random: (Number) Matches packets randomly with a given probability.
            reject_with: (String) Specifies ICMP error to be sent back if the packet is rejected. Applicable if action=reject.
            routing_mark: (String) Matches packets marked by mangle facility with particular routing mark.
            routing_table: (String) Matches packets which destination address is resolved in specific a routing table.
            src_address: (String) Matches packets which source is equal to specified IP or falls into a specified IP range.
            src_address_list: (String) Matches source address of a packet against user-defined address list.
            src_address_type: (String) Matches source address type.
            src_mac_address: (String) Matches source MAC address of the packet.
            src_port: (String) List of source ports and ranges of source ports. Applicable only if a protocol is TCP or UDP.
            tcp_flags: (String) Matches specified TCP flags.
            tcp_mss: (String) Matches TCP MSS value of an IP packet.
            time: (String) Allows to create a filter based on the packets' arrival time and date or, for locally generated packets, departure time and date.
            tls_host: (String) Allows matching HTTPS traffic based on TLS SNI hostname.
            ttl: (String) Matches packets TTL value.
        importStatements:
            - terraform import routeros_ip_firewall_filter.rule "*0"
            - terraform import routeros_ip_firewall_filter.rule "name=xxx"
    routeros_ip_firewall_layer7_protocol:
        subCategory: ""
        name: routeros_ip_firewall_layer7_protocol
        title: routeros_ip_firewall_layer7_protocol (Resource)
        argumentDocs:
            id: (String) The ID of this resource.
            name: (String) Descriptive name of l7 pattern used by configuration in firewall rules.
            regexp: (String) POSIX compliant regular expression is used to match a pattern.
        importStatements:
            - terraform import routeros_ip_firewall_layer7_protocol.test *3
            - terraform import routeros_ip_firewall_layer7_protocol.test "name=xxx"
