        subCategory: ""
        description: '#### This is an alias for backwards compatibility between plugin versions. Please see documentation for [routeros_ip_dhcp_server_lease](ip_dhcp_server_lease.md)'
        name: routeros_dhcp_server_lease
        title: routeros_dhcp_server_lease (Resource)
        argumentDocs: {}
        importStatements: []
    routeros_dhcp_server_network:
        subCategory: ""
        description: '#### This is an alias for backwards compatibility between plugin versions. Please see documentation for [routeros_ip_dhcp_server_network](ip_dhcp_server_network.md)'
        name: routeros_dhcp_server_network
        title: routeros_dhcp_server_network (Resource)
        argumentDocs: {}
        importStatements: []
    routeros_disk_settings:
        subCategory: ""
        name: routeros_disk_settings
        title: routeros_disk_settings (Resource)
        argumentDocs:
            auto_media_interface: (String) Interface that will be used in dynamic instance for ip/media when new disk/partition item is added in '/disk'.
            auto_media_sharing: (Boolean) Enables media dynamically when new disk/partition item is added in '/disk'.
            auto_smb_sharing: (Boolean) Enables dynamic SMB shares when new disk/partition item is added in '/disk'.
            auto_smb_user: (String) Default value for smb-sharing/smb-user setting, when new disk/partition item is added in '/disk'.
            default_mount_point_template: (String) Sets the default mount point template for each item added in `/disk`.
            id: (String) The ID of this resource.
        importStatements:
