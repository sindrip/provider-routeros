        argumentDocs:
            disabled: (Boolean)
            export: '(Block List, Max: 1) A group of parameters associated with the route export. (see [below for nested schema](#nestedblock--export))'
            filter_chain: (String) The name of the routing filter chain that is used to filter prefixes during import.
            filter_select: (String) The name of the select filter chain that is used to select prefixes to be exported exporting.
            id: (String) The ID of this resource.
            import: '(Block List, Max: 1) A group of parameters associated with the route import. (see [below for nested schema](#nestedblock--import))'
            inactive: (Boolean)
            instance: (String) Name of the instance this VPN is assigned to.
            label_allocation_policy: (String) Label allocationpolicy.
            name: (String) VPN instance name.
            redistribute: (String) Enable redistribution of specified route types from VRF to VPNv4.
            route_distinguisher: (String) Helps to distinguish between overlapping routes from multiple VRFs. Should be unique per VRF. Accepts 3 types of formats.
            route_targets: (Set of String) List of route targets that will be used to import VPNv4 routes. The accepted RT format is similar to the one for Route Distinguishers.
            router_id: (String) The router ID of the BGP instance that will be used for the BGP best path selection algorithm.
            vrf: (String) The VRF table this resource operates on.
        importStatements:
