name: routeros-lab

services:
  r1:
    image: mikrotik/chr:${CHR_VERSION:-7.23.3}
    privileged: true
    # The VM's ether1 MAC is this + 1; dhcp pins its lease to .11.
    mac_address: 02:52:6f:53:00:10
    networks: [mgmt]

  dhcp:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.24
        RUN apk add --no-cache dnsmasq
    cap_add: [NET_ADMIN]
    command: >-
      dnsmasq --no-daemon --port=0
      --dhcp-range=172.31.99.0,static
      --dhcp-host=02:52:6f:53:00:11,172.31.99.11
    networks: [mgmt]

  # macOS can't reach the leased address; gw publishes it and carries the
  # readiness healthcheck `up --wait` blocks on.
  gw:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.24
        RUN apk add --no-cache socat
    command: socat TCP-LISTEN:80,fork,reuseaddr TCP:172.31.99.11:80
    ports:
      - "127.0.0.1:18080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://admin:@172.31.99.11/rest/system/resource"]
      interval: 5s
      start_period: 240s
    networks: [mgmt]

networks:
  mgmt:
    ipam:
      config:
        - subnet: 172.31.99.0/24
