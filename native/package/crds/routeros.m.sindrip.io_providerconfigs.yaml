                - message: endpoint must use http or https
                  rule: self.startsWith('http://') || self.startsWith('https://')
              requestTimeout:
                description: |-
                  RequestTimeout bounds one RouterOS REST request. Values below five
                  seconds are rejected. The default is 59 seconds.
                type: string
              tls:
                description: TLS controls HTTPS server verification. Omit it for normal
                  system trust.
                properties:
                  caSecretRef:
                    description: |-
                      CASecretRef selects a PEM CA bundle from a Secret in the
                      ProviderConfig's namespace.
                    properties:
                      key:
                        type: string
                      name:
