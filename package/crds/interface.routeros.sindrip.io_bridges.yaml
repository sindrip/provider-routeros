spec:
  group: interface.routeros.sindrip.io
  names:
    categories:
    - crossplane
    - managed
    - routeros
    kind: Bridge
    listKind: BridgeList
    plural: bridges
    singular: bridge
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
