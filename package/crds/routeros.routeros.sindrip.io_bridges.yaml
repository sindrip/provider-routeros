  group: routeros.routeros.sindrip.io
  names:
    categories:
    - crossplane
    - managed
    - routeros
    kind: Bridge
    listKind: BridgeList
    plural: bridges
    singular: bridge
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'Bridge is the Schema for the Bridges API. #### This is an alias
          for backwards compatibility between plugin versions. Please see documentation
          for [routeros_interface_bridge](interface_bridge.md)'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BridgeSpec defines the desired state of Bridge
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what will happen to the underlying external
                  when this managed resource is deleted - either "Delete" or "Orphan" the
                  external resource.
                  This field is planned to be deprecated in favor of the ManagementPolicies
                  field in a future release. Currently, both could be set independently and
                  non-default values would be honored if the feature flag is enabled.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                properties:
                  addDhcpOption82:
                    description: Whether to add DHCP Option-82 information (Agent
                      Remote ID and Agent Circuit ID) to DHCP packets. Can be used
                      together with Option-82 capable DHCP server to assign IP addresses
                      and implement policies. This property only has effect when dhcp-snooping
                      is set to yes.
                    type: boolean
                  adminMac:
                    description: Static MAC address of the bridge. This property only
                      has effect when auto-mac is set to no.
                    type: string
                  ageingTime:
                    description: How long a host's information will be kept in the
                      bridge database.
                    type: string
                  arp:
                    description: |-
                      Address Resolution Protocol mode:
                      * disabled - the interface will not use ARP
                      * enabled - the interface will use ARP
                      * local-proxy-arp - the router performs proxy ARP on the interface and sends replies to the same interface
                      * proxy-arp - the router performs proxy ARP on the interface and sends replies to other interfaces
                      * reply-only - the interface will only reply to requests originated from matching IP address/MAC address combinations which are entered as static entries in the ARP table. No dynamic entries will be automatically stored in the ARP table. Therefore for communications to be successful, a valid static entry must already exist.
                    type: string
                  arpTimeout:
                    description: ARP timeout is time how long ARP record is kept in
                      ARP table after no packets are received from IP. Value auto
                      equals to the value of arp-timeout in IP/Settings, default is
                      30s. Can use postfix `ms`, `s`, `m`, `h`, `d` for milliseconds,
                      seconds, minutes, hours or days. If no postfix is set then seconds
                      (s) is used.
                    type: string
                  autoMac:
                    description: Automatically select one MAC address of bridge ports
                      as a bridge MAC address, bridge MAC will be chosen from the
                      first added bridge port. After a device reboot, the bridge MAC
                      can change depending on the port-number.
                    type: boolean
                  comment:
                    type: string
                  dhcpSnooping:
                    type: boolean
                  disabled:
                    type: boolean
                  etherType:
                    description: This property only has effect when vlan-filtering
                      is set to yes.
                    type: string
                  fastForward:
                    type: boolean
                  forwardDelay:
                    description: Time which is spent during the initialization phase
                      of the bridge interface (i.e., after router startup or enabling
                      the interface) in listening/learning state before the bridge
                      will start functioning normally.
                    type: string
                  forwardReservedAddresses:
                    description: An option whether to forward IEEE reserved multicast
                      MAC addresses that are in the `01:80:C2:00:00:0x` range. This
                      option is available in RouterOS starting from version 7.16.
                    type: boolean
                  frameTypes:
                    description: Specifies allowed frame types on a bridge port. This
                      property only has effect when vlan-filtering is set to yes.
                    type: string
                  igmpSnooping:
                    description: Enables multicast group and port learning to prevent
                      multicast traffic from flooding all interfaces in a bridge.
                    type: boolean
                  igmpVersion:
                    description: Selects the IGMP version in which IGMP general membership
                      queries will be generated. This property only has effect when
                      igmp-snooping is set to yes.
                    format: int64
                    type: integer
                  ingressFiltering:
                    description: Enables or disables VLAN ingress filtering, which
                      checks if the ingress port is a member of the received VLAN
                      ID in the bridge VLAN table. Should be used with frame-types
                      to specify if the ingress traffic should be tagged or untagged.
                      This property only has effect when vlan-filtering is set to
                      yes.
                    type: boolean
                  lastMemberInterval:
                    description: If a port has fast-leave set to no and a bridge port
                      receives a IGMP Leave message, then a IGMP Snooping enabled
                      bridge will send a IGMP query to make sure that no devices has
                      subscribed to a certain multicast stream on a bridge port.
