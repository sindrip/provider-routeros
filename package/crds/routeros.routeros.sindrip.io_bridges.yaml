                    type: integer
                  mtu:
                    description: The default bridge MTU value without any bridge ports
                      added is 1500. The MTU value can be set manually, but it cannot
                      exceed the bridge L2MTU or the lowest bridge port L2MTU. If
                      a new bridge port is added with L2MTU which is smaller than
                      the actual-mtu of the bridge (set by the mtu property), then
                      manually set value will be ignored and the bridge will act as
                      if mtu=auto is set.
                    type: string
                  multicastQuerier:
                    description: Multicast querier generates IGMP general membership
                      queries to which all IGMP capable devices respond with an IGMP
                      membership report, usually a PIM (multicast) router or IGMP
                      proxy generates these queries. This property only has an effect
                      when igmp-snooping is set to yes. Additionally, the igmp-snooping
                      should be disabled/enabled after changing multicast-querier
                      property.
                    type: boolean
                  multicastRouter:
                    description: A multicast router port is a port where a multicast
                      router or querier is connected. On this port, unregistered multicast
                      streams and IGMP/MLD membership reports will be sent. This setting
                      changes the state of the multicast router for a bridge interface
                      itself. This property can be used to send IGMP/MLD membership
                      reports and multicast traffic to the bridge interface for further
                      multicast routing or proxying. This property only has an effect
                      when igmp-snooping is set to yes.
                    type: string
                  mvrp:
                    description: Enables MVRP for bridge (available since RouterOS
                      7.15). It ensures that the MAC address 01:80:C2:00:00:21 is
                      trapped and not forwarded, the vlan-filtering must be enabled.
                    type: boolean
                  name:
                    description: Changing the name of this resource will force it
                      to be recreated
                    type: string
                  portCostMode:
                    description: An option that changes the port path cost and internal
                      path cost mode for bridged ports, utilizing automatic values
                      based on interface speed.
                    type: string
                  priority:
                    description: Bridge priority, used by STP to determine root bridge,
                      used by MSTP to determine CIST and IST regional root bridge.
                      This property has no effect when protocol-mode is set to none.
                    type: string
                  protocolMode:
                    description: Select Spanning tree protocol (STP) or Rapid spanning
                      tree protocol (RSTP) to ensure a loop-free topology for any
                      bridged LAN.
                    type: string
                  pvid:
                    description: Port VLAN ID (pvid) specifies which VLAN the untagged
                      ingress traffic is assigned to. It applies e.g. to frames sent
                      from bridge IP and destined to a bridge port. This property
                      only has effect when vlan-filtering is set to yes.
                    format: int64
                    type: integer
                  querierInterval:
                    description: Used to change the interval how often a bridge checks
                      if it is the active multicast querier. This property only has
                      effect when igmp-snooping and multicast-querier is set to yes.
                    type: string
                  queryInterval:
                    description: Used to change the interval how often IGMP general
                      membership queries are sent out. This property only has effect
                      when igmp-snooping and multicast-querier is set to yes.
                    type: string
                  queryResponseInterval:
                    description: Interval in which a IGMP capable device must reply
                      to a IGMP query with a IGMP membership report. This property
                      only has effect when igmp-snooping and multicast-querier is
                      set to yes.
                    type: string
                  regionName:
                    description: MSTP region name. This property only has effect when
                      protocol-mode is set to mstp.
                    type: string
                  regionRevision:
                    description: MSTP configuration revision number. This property
                      only has effect when protocol-mode is set to mstp.
                    format: int64
                    type: integer
                  startupQueryCount:
                    description: Specifies how many times must startup-query-interval
                      pass until the bridge starts sending out IGMP general membership
                      queries periodically. This property only has effect when igmp-snooping
                      and multicast-querier is set to yes.
                    format: int64
                    type: integer
                  startupQueryInterval:
                    description: Used to change the amount of time after a bridge
                      starts sending out IGMP general membership queries after the
                      bridge is enabled. This property only has effect when igmp-snooping
                      and multicast-querier is set to yes.
                    type: string
                  transmitHoldCount:
                    description: The Transmit Hold Count used by the Port Transmit
                      state machine to limit transmission rate.
                    format: int64
                    type: integer
                  vlanFiltering:
                    description: Globally enables or disables VLAN functionality for
                      bridge.
                    type: boolean
                type: object
