                  autoMac:
                    description: Automatically select one MAC address of bridge ports
                      as a bridge MAC address, bridge MAC will be chosen from the
                      first added bridge port. After a device reboot, the bridge MAC
                      can change depending on the port-number.
                    type: boolean
                  comment:
                    type: string
                  dhcpSnooping:
                    type: boolean
                  disabled:
                    type: boolean
                  dynamic:
                    description: Configuration item created by software, not by management
                      interface. It is not exported, and cannot be directly modified.
                    type: boolean
                  etherType:
                    description: This property only has effect when vlan-filtering
                      is set to yes.
                    type: string
                  fastForward:
                    type: boolean
                  forwardDelay:
                    description: Time which is spent during the initialization phase
                      of the bridge interface (i.e., after router startup or enabling
                      the interface) in listening/learning state before the bridge
                      will start functioning normally.
                    type: string
                  forwardReservedAddresses:
                    description: An option whether to forward IEEE reserved multicast
                      MAC addresses that are in the `01:80:C2:00:00:0x` range. This
                      option is available in RouterOS starting from version 7.16.
                    type: boolean
                  frameTypes:
                    description: Specifies allowed frame types on a bridge port. This
                      property only has effect when vlan-filtering is set to yes.
                    type: string
                  id:
                    type: string
                  igmpSnooping:
                    description: Enables multicast group and port learning to prevent
                      multicast traffic from flooding all interfaces in a bridge.
                    type: boolean
                  igmpVersion:
                    description: Selects the IGMP version in which IGMP general membership
                      queries will be generated. This property only has effect when
                      igmp-snooping is set to yes.
                    format: int64
                    type: integer
                  ingressFiltering:
                    description: Enables or disables VLAN ingress filtering, which
                      checks if the ingress port is a member of the received VLAN
                      ID in the bridge VLAN table. Should be used with frame-types
                      to specify if the ingress traffic should be tagged or untagged.
                      This property only has effect when vlan-filtering is set to
                      yes.
                    type: boolean
                  l2mtu:
                    description: Layer2 Maximum transmission unit. [See](https://wiki.mikrotik.com/wiki/Maximum_Transmission_Unit_on_RouterBoards).
                    format: int64
                    type: integer
                  lastMemberInterval:
                    description: If a port has fast-leave set to no and a bridge port
                      receives a IGMP Leave message, then a IGMP Snooping enabled
                      bridge will send a IGMP query to make sure that no devices has
                      subscribed to a certain multicast stream on a bridge port.
                    type: string
                  lastMemberQueryCount:
                    description: How many times should last-member-interval pass until
                      a IGMP Snooping bridge will stop forwarding a certain multicast
                      stream. This property only has effect when igmp-snooping is
                      set to yes.
                    format: int64
                    type: integer
                  macAddress:
                    description: Current mac address.
                    type: string
                  maxHops:
                    description: Bridge count which BPDU can pass in a MSTP enabled
                      network in the same region before BPDU is being ignored. This
                      property only has effect when protocol-mode is set to mstp.
                    format: int64
                    type: integer
                  maxLearnedEntries:
                    description: An option to set the maximum number of learned hosts
                      for the bridge interface. This option is available in RouterOS
                      starting from version 7.16.
                    type: string
                  maxMessageAge:
                    description: 'Changes the Max Age value in BPDU packets, which
                      is transmitted by the root bridge. This property only has effect
                      when protocol-mode is set to stp or rstp. Value: 6s..40s'
                    type: string
                  membershipInterval:
                    description: Amount of time after an entry in the Multicast Database
                      (MDB) is removed if a IGMP membership report is not received
                      on a certain port. This property only has effect when igmp-snooping
                      is set to yes.
                    type: string
                  mldVersion:
                    description: Selects the MLD version. Version 2 adds support for
                      source-specific multicast. This property only has effect when
                      RouterOS IPv6 package is enabled and igmp-snooping is set to
                      yes.
                    format: int64
                    type: integer
                  mtu:
                    description: The default bridge MTU value without any bridge ports
                      added is 1500. The MTU value can be set manually, but it cannot
                      exceed the bridge L2MTU or the lowest bridge port L2MTU. If
                      a new bridge port is added with L2MTU which is smaller than
                      the actual-mtu of the bridge (set by the mtu property), then
                      manually set value will be ignored and the bridge will act as
                      if mtu=auto is set.
                    type: string
                  multicastQuerier:
                    description: Multicast querier generates IGMP general membership
                      queries to which all IGMP capable devices respond with an IGMP
                      membership report, usually a PIM (multicast) router or IGMP
                      proxy generates these queries. This property only has an effect
                      when igmp-snooping is set to yes. Additionally, the igmp-snooping
                      should be disabled/enabled after changing multicast-querier
                      property.
                    type: boolean
                  multicastRouter:
                    description: A multicast router port is a port where a multicast
                      router or querier is connected. On this port, unregistered multicast
                      streams and IGMP/MLD membership reports will be sent. This setting
                      changes the state of the multicast router for a bridge interface
                      itself. This property can be used to send IGMP/MLD membership
                      reports and multicast traffic to the bridge interface for further
                      multicast routing or proxying. This property only has an effect
                      when igmp-snooping is set to yes.
                    type: string
                  mvrp:
                    description: Enables MVRP for bridge (available since RouterOS
                      7.15). It ensures that the MAC address 01:80:C2:00:00:21 is
                      trapped and not forwarded, the vlan-filtering must be enabled.
                    type: boolean
                  name:
                    description: Changing the name of this resource will force it
                      to be recreated
                    type: string
                  portCostMode:
                    description: An option that changes the port path cost and internal
                      path cost mode for bridged ports, utilizing automatic values
                      based on interface speed.
                    type: string
                  priority:
                    description: Bridge priority, used by STP to determine root bridge,
                      used by MSTP to determine CIST and IST regional root bridge.
                      This property has no effect when protocol-mode is set to none.
                    type: string
                  protocolMode:
                    description: Select Spanning tree protocol (STP) or Rapid spanning
                      tree protocol (RSTP) to ensure a loop-free topology for any
                      bridged LAN.
                    type: string
                  pvid:
                    description: Port VLAN ID (pvid) specifies which VLAN the untagged
                      ingress traffic is assigned to. It applies e.g. to frames sent
                      from bridge IP and destined to a bridge port. This property
                      only has effect when vlan-filtering is set to yes.
                    format: int64
                    type: integer
                  querierInterval:
                    description: Used to change the interval how often a bridge checks
                      if it is the active multicast querier. This property only has
                      effect when igmp-snooping and multicast-querier is set to yes.
                    type: string
                  queryInterval:
                    description: Used to change the interval how often IGMP general
                      membership queries are sent out. This property only has effect
                      when igmp-snooping and multicast-querier is set to yes.
                    type: string
                  queryResponseInterval:
                    description: Interval in which a IGMP capable device must reply
                      to a IGMP query with a IGMP membership report. This property
                      only has effect when igmp-snooping and multicast-querier is
                      set to yes.
                    type: string
                  regionName:
                    description: MSTP region name. This property only has effect when
                      protocol-mode is set to mstp.
                    type: string
                  regionRevision:
                    description: MSTP configuration revision number. This property
                      only has effect when protocol-mode is set to mstp.
                    format: int64
                    type: integer
                  running:
                    type: boolean
                  startupQueryCount:
                    description: Specifies how many times must startup-query-interval
                      pass until the bridge starts sending out IGMP general membership
                      queries periodically. This property only has effect when igmp-snooping
                      and multicast-querier is set to yes.
                    format: int64
                    type: integer
                  startupQueryInterval:
                    description: Used to change the amount of time after a bridge
                      starts sending out IGMP general membership queries after the
                      bridge is enabled. This property only has effect when igmp-snooping
                      and multicast-querier is set to yes.
                    type: string
                  transmitHoldCount:
                    description: The Transmit Hold Count used by the Port Transmit
                      state machine to limit transmission rate.
                    format: int64
                    type: integer
                  vlanFiltering:
                    description: Globally enables or disables VLAN functionality for
                      bridge.
                    type: boolean
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
