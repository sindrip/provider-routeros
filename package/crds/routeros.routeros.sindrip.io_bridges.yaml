                    type: integer
                  maxLearnedEntries:
                    description: An option to set the maximum number of learned hosts
                      for the bridge interface. This option is available in RouterOS
                      starting from version 7.16.
                    type: string
                  maxMessageAge:
                    description: 'Changes the Max Age value in BPDU packets, which
